version: '3.9'

#############################################
# MetaPharm Connect - Docker Compose
#############################################
# Complete production-ready configuration with:
# - All 31 backend services (ports 4000-4030)
# - All 3 frontend services (ports 3000-3002)
# - Database and cache infrastructure
# - Observability stack (Jaeger)
#############################################

services:
  # ========================================
  # Infrastructure Services
  # ========================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metapharm
      POSTGRES_PASSWORD: metapharm_dev_password
      POSTGRES_DB: metapharm_db
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metapharm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - metapharm-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - metapharm-network
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - "6831:6831/udp"
      - "4318:4318"
      - "16686:16686"
    networks:
      - metapharm-network
    restart: unless-stopped

  # ========================================
  # Backend Services (31 services, ports 4000-4030)
  # ========================================

  # API Gateway - Main entry point
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
        NODE_ENV: development
    environment:
      NODE_ENV: development
      PORT: 4000
      SERVICE_NAME: api-gateway
      DATABASE_URL: postgresql://metapharm:metapharm_dev_password@postgres:5432/metapharm_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-key-change-in-production
      LOG_LEVEL: info
      OTLP_EXPORTER_URL: http://jaeger:4318/v1/traces
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - metapharm-network
    restart: unless-stopped

  # Auth Service
  auth-service:
