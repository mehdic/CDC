# IMPORTANT: This is a TEMPLATE file.
# DO NOT commit actual secrets to version control.
# Use Kubernetes Secrets management or external secret stores (HashiCorp Vault, AWS Secrets Manager, Azure Key Vault)
#
# To create secrets from files:
# kubectl create secret generic metapharm-secrets \
#   --from-literal=DB_PASSWORD='your-db-password' \
#   --from-literal=JWT_SECRET='your-jwt-secret' \
#   --from-literal=ENCRYPTION_KEY='your-encryption-key' \
#   --namespace=metapharm

apiVersion: v1
kind: Secret
metadata:
  name: metapharm-secrets
  namespace: metapharm
type: Opaque
stringData:
  # Database Credentials (REPLACE WITH ACTUAL VALUES)
  DB_USERNAME: "metapharm_user"
  DB_PASSWORD: "REPLACE_WITH_SECURE_PASSWORD"

  # Redis Password
  REDIS_PASSWORD: "REPLACE_WITH_SECURE_PASSWORD"

  # JWT Secret (256-bit minimum for HS256)
  JWT_SECRET: "REPLACE_WITH_SECURE_JWT_SECRET"
  JWT_REFRESH_SECRET: "REPLACE_WITH_SECURE_JWT_REFRESH_SECRET"

  # Encryption Keys (AES-256)
  ENCRYPTION_KEY: "REPLACE_WITH_32_BYTE_ENCRYPTION_KEY"
  ENCRYPTION_IV: "REPLACE_WITH_16_BYTE_IV"

  # Swiss HIN e-ID Credentials
  HIN_CLIENT_ID: "REPLACE_WITH_HIN_CLIENT_ID"
  HIN_CLIENT_SECRET: "REPLACE_WITH_HIN_CLIENT_SECRET"

  # External API Keys
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_AWS_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_AWS_SECRET_KEY"
  AWS_TEXTRACT_REGION: "eu-central-1"

  # Twilio/Video Call Credentials
  TWILIO_ACCOUNT_SID: "REPLACE_WITH_TWILIO_SID"
  TWILIO_AUTH_TOKEN: "REPLACE_WITH_TWILIO_TOKEN"
  TWILIO_API_KEY: "REPLACE_WITH_TWILIO_API_KEY"
  TWILIO_API_SECRET: "REPLACE_WITH_TWILIO_API_SECRET"

  # WhatsApp Business API
  WHATSAPP_API_KEY: "REPLACE_WITH_WHATSAPP_API_KEY"
  WHATSAPP_PHONE_NUMBER_ID: "REPLACE_WITH_PHONE_NUMBER_ID"

  # Payment Gateway Credentials
  STRIPE_SECRET_KEY: "REPLACE_WITH_STRIPE_SECRET_KEY"
  STRIPE_WEBHOOK_SECRET: "REPLACE_WITH_STRIPE_WEBHOOK_SECRET"

  # E-santé API Credentials (Swiss Cantonal Health Records)
  ESANTE_API_KEY: "REPLACE_WITH_ESANTE_API_KEY"
  ESANTE_CLIENT_CERTIFICATE: "REPLACE_WITH_BASE64_ENCODED_CERT"
  ESANTE_CLIENT_KEY: "REPLACE_WITH_BASE64_ENCODED_KEY"

  # Insurance Integration
  INSURANCE_API_KEY: "REPLACE_WITH_INSURANCE_API_KEY"

  # Session Secret
  SESSION_SECRET: "REPLACE_WITH_SESSION_SECRET"
