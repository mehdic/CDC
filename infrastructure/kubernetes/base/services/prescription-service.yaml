apiVersion: apps/v1
kind: Deployment
metadata:
  name: prescription-service
  namespace: metapharm
  labels:
    app: prescription-service
    tier: backend
    criticality: critical
    compliance: hipaa
spec:
  replicas: 3
  selector:
    matchLabels:
      app: prescription-service
  template:
    metadata:
      labels:
        app: prescription-service
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3002"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: prescription-service
          image: metapharm/prescription-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
          env:
            - name: PORT
              value: "3002"
            - name: SERVICE_NAME
              value: "prescription-service"
          envFrom:
            - configMapRef:
                name: metapharm-config
            - secretRef:
                name: metapharm-secrets
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: prescription-data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: prescription-data
          emptyDir: {}
      securityContext:
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: prescription-service
  namespace: metapharm
  labels:
    app: prescription-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3002
      targetPort: http
      protocol: TCP
  selector:
    app: prescription-service
