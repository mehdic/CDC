apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: metapharm-dev

bases:
  - ../../base

namePrefix: dev-

commonLabels:
  environment: development

# Override replicas for development
replicas:
  - name: api-gateway
    count: 1
  - name: auth-service
    count: 1
  - name: prescription-service
    count: 1

# Patch configmap for development environment
configMapGenerator:
  - name: metapharm-config
    behavior: merge
    literals:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080

# Patch resource limits for development
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
    target:
      kind: Deployment
      name: api-gateway

  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
    target:
      kind: Deployment
      name: auth-service
