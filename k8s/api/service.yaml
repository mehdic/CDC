# MetaPharm Connect - API Gateway Service
apiVersion: v1
kind: Service
metadata:
  name: metapharm-api-svc
  namespace: metapharm
  labels:
    app.kubernetes.io/name: metapharm-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: metapharm-connect
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4000"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: metapharm-api
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
  sessionAffinity: None
