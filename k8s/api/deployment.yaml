# MetaPharm Connect - API Gateway Deployment
# Production-grade deployment with security, HA, and observability
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metapharm-api
  namespace: metapharm
  labels:
    app.kubernetes.io/name: metapharm-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: metapharm-connect
    app.kubernetes.io/version: "1.0.0"
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: metapharm-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metapharm-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: metapharm-connect
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      # Security: Use dedicated service account
      serviceAccountName: metapharm-api
      automountServiceAccountToken: false

      # Security context for pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001  # nodejs user from Dockerfile
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      # Spread pods across nodes for HA
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: metapharm-api
                topologyKey: kubernetes.io/hostname
        # Prefer nodes in different zones
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: Exists

      # Tolerate node issues briefly
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30

      # Init container to wait for dependencies
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres.metapharm.svc.cluster.local 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL

      containers:
        - name: api
          image: ghcr.io/mehdic/cdc/api-gateway:latest
          imagePullPolicy: Always

          # Container security
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 4000
              protocol: TCP

          # Environment from ConfigMaps
          envFrom:
            - configMapRef:
                name: metapharm-config
            - configMapRef:
                name: metapharm-api-config

          # Sensitive environment from Secrets
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: metapharm-config
                  key: NODE_ENV
            - name: PORT
              value: "4000"
            - name: SERVICE_NAME
              value: "api-gateway"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: metapharm-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: metapharm-secrets
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: metapharm-secrets
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: metapharm-secrets
                  key: JWT_REFRESH_SECRET

          # Resource limits as specified (512Mi memory, 500m CPU)
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Startup probe for slow-starting containers
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30

          # Readiness probe - determines if pod can receive traffic
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          # Liveness probe - determines if pod should be restarted
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3

          # Volume mounts for read-only filesystem
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-tmp
              mountPath: /app/tmp

      # Ephemeral volumes for writable directories
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-tmp
          emptyDir: {}

      # Graceful shutdown - allow time for connections to drain
      terminationGracePeriodSeconds: 60

      # Pull from private registry if needed
      imagePullSecrets:
        - name: metapharm-registry
---
# Service Account for API pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metapharm-api
  namespace: metapharm
  labels:
    app.kubernetes.io/name: metapharm-api
automountServiceAccountToken: false
---
# PodDisruptionBudget for HA during maintenance
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: metapharm-api-pdb
  namespace: metapharm
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metapharm-api
---
# HorizontalPodAutoscaler for auto-scaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: metapharm-api-hpa
  namespace: metapharm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: metapharm-api
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max
