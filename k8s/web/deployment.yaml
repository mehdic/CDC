# MetaPharm Connect - Web Frontend Deployment
# Production-grade deployment with security, HA, and observability
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metapharm-web
  namespace: metapharm
  labels:
    app.kubernetes.io/name: metapharm-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: metapharm-connect
    app.kubernetes.io/version: "1.0.0"
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: metapharm-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metapharm-web
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: metapharm-connect
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/metrics"
    spec:
      # Security: Don't use default service account
      serviceAccountName: metapharm-web
      automountServiceAccountToken: false

      # Security context for pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 101  # nginx user
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      # Spread pods across nodes for HA
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: metapharm-web
                topologyKey: kubernetes.io/hostname
        # Prefer nodes in different zones
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: Exists

      # Tolerate node issues briefly
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30

      containers:
        - name: web
          image: ghcr.io/mehdic/cdc/web:latest
          imagePullPolicy: Always

          # Container security
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          # Environment from ConfigMap
          envFrom:
            - configMapRef:
                name: metapharm-web-config

          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: metapharm-config
                  key: NODE_ENV

          # Resource limits as specified
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

          # Startup probe for slow-starting containers
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          # Readiness probe - determines if pod can receive traffic
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3

          # Liveness probe - determines if pod should be restarted
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          # Volume mounts for read-only filesystem
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run

      # Ephemeral volumes for writable directories
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}

      # Graceful shutdown
      terminationGracePeriodSeconds: 30

      # Pull from private registry if needed
      imagePullSecrets:
        - name: metapharm-registry
---
# Service Account for web pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metapharm-web
  namespace: metapharm
  labels:
    app.kubernetes.io/name: metapharm-web
automountServiceAccountToken: false
---
# PodDisruptionBudget for HA during maintenance
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: metapharm-web-pdb
  namespace: metapharm
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metapharm-web
---
# HorizontalPodAutoscaler for auto-scaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: metapharm-web-hpa
  namespace: metapharm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: metapharm-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max
