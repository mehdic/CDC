# MetaPharm Connect - Configuration
# Non-sensitive configuration values
apiVersion: v1
kind: ConfigMap
metadata:
  name: metapharm-config
  namespace: metapharm
  labels:
    app.kubernetes.io/name: metapharm
    app.kubernetes.io/part-of: metapharm-connect
data:
  # Application environment
  NODE_ENV: "production"
  LOG_LEVEL: "info"

  # Service ports
  WEB_PORT: "80"
  API_PORT: "4000"

  # Feature flags
  FEATURE_TELECONSULTATION: "true"
  FEATURE_VIP_PROGRAM: "true"
  FEATURE_AI_PRESCRIPTIONS: "true"
  FEATURE_DIGITAL_TWIN: "true"
  FEATURE_ESANTE_INTEGRATION: "false"

  # API configuration
  API_TIMEOUT_MS: "30000"
  API_RATE_LIMIT: "100"

  # Observability
  OTLP_EXPORTER_URL: "http://jaeger:4318/v1/traces"
  METRICS_ENABLED: "true"
  TRACING_ENABLED: "true"

  # Cache configuration
  CACHE_TTL_SECONDS: "300"
  SESSION_TTL_SECONDS: "3600"

  # Healthcare compliance
  AUDIT_LOGGING_ENABLED: "true"
  DATA_RETENTION_DAYS: "365"
  ENCRYPTION_REQUIRED: "true"
---
# Web-specific configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: metapharm-web-config
  namespace: metapharm
  labels:
    app.kubernetes.io/name: metapharm-web
    app.kubernetes.io/component: frontend
data:
  # Build-time environment (embedded in static files)
  VITE_API_URL: "https://api.metapharm.ch"
  VITE_API_GATEWAY: "https://api.metapharm.ch/api"
  VITE_APP_NAME: "MetaPharm Connect"
  VITE_APP_VERSION: "1.0.0"

  # Nginx configuration overrides
  NGINX_WORKER_PROCESSES: "auto"
  NGINX_WORKER_CONNECTIONS: "1024"
---
# API-specific configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: metapharm-api-config
  namespace: metapharm
  labels:
    app.kubernetes.io/name: metapharm-api
    app.kubernetes.io/component: backend
data:
  # Service mesh configuration
  SERVICE_DISCOVERY: "kubernetes"

  # Database configuration (non-sensitive)
  DB_POOL_SIZE: "20"
  DB_IDLE_TIMEOUT_MS: "10000"
  DB_CONNECTION_TIMEOUT_MS: "5000"

  # Redis configuration (non-sensitive)
  REDIS_MAX_RETRIES: "3"
  REDIS_RETRY_DELAY_MS: "100"

  # JWT configuration (non-sensitive)
  JWT_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"

  # File upload limits
  MAX_UPLOAD_SIZE_MB: "10"
  ALLOWED_FILE_TYPES: "pdf,jpg,jpeg,png"
