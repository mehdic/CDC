version: '3.9'

#############################################
# MetaPharm Connect - CI Testing Configuration
#############################################
# Usage: docker-compose -f docker-compose.yml -f docker-compose.test.yml up
#
# CI/Testing-specific configuration:
# - No volume persistence (ephemeral database)
# - Fast health check intervals
# - Test database initialization
# - Minimal services configuration
# - Resource limits for CI environments
#############################################

services:
  # ========================================
  # Infrastructure Overrides (Ephemeral)
  # ========================================

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metapharm
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: metapharm_test
      POSTGRES_INITDB_ARGS: "-c max_connections=100"
    volumes:
      - /var/lib/postgresql/data  # Ephemeral volume (no persistence)
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metapharm"]
      interval: 5s
      timeout: 3s
      retries: 3
    ports:
      - "5433:5432"  # Alternative port to avoid conflicts

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly no  # Disable AOF for speed
    volumes:
      - /data  # Ephemeral volume
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    ports:
      - "6380:6379"  # Alternative port to avoid conflicts

  # ========================================
  # Backend Service Overrides (Test Mode)
  # ========================================

  api-gateway:
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://metapharm:test_password@postgres:5432/metapharm_test
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: error
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 20s

  auth-service:
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://metapharm:test_password@postgres:5432/metapharm_test
