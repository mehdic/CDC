apiVersion: v1
kind: Secret
metadata:
  name: {{ include "metapharm-connect.fullname" . }}-secrets
  labels:
    {{- include "metapharm-connect.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database credentials
  database-url: {{ include "metapharm-connect.databaseUrl" . | quote }}

  # Redis credentials
  redis-url: {{ include "metapharm-connect.redisUrl" . | quote }}

  # JWT secret
  jwt-secret: {{ include "metapharm-connect.jwtSecret" . | quote }}

  # External service API keys (should be overridden in production)
  {{- if .Values.secrets.stripe }}
  stripe-api-key: {{ .Values.secrets.stripe.apiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.sendgrid }}
  sendgrid-api-key: {{ .Values.secrets.sendgrid.apiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.twilio }}
  twilio-account-sid: {{ .Values.secrets.twilio.accountSid | quote }}
  twilio-auth-token: {{ .Values.secrets.twilio.authToken | quote }}
  {{- end }}
