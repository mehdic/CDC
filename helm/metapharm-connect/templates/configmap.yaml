apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "metapharm-connect.fullname" . }}-config
  labels:
    {{- include "metapharm-connect.labels" . | nindent 4 }}
data:
  # Logging configuration
  LOG_LEVEL: {{ .Values.config.logging.level | quote }}
  LOG_FORMAT: {{ .Values.config.logging.format | quote }}

  # Database configuration (non-sensitive)
  DATABASE_MAX_CONNECTIONS: {{ .Values.config.database.maxConnections | quote }}

  # JWT configuration (non-sensitive)
  JWT_EXPIRES_IN: {{ .Values.config.jwt.expiresIn | quote }}
  JWT_REFRESH_EXPIRES_IN: {{ .Values.config.jwt.refreshExpiresIn | quote }}

  # Tracing configuration
  TRACING_ENABLED: {{ .Values.config.tracing.enabled | quote }}
  {{- if .Values.config.tracing.enabled }}
  OTLP_EXPORTER_URL: {{ include "metapharm-connect.otlpExporterUrl" . | quote }}
  {{- end }}
