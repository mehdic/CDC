{{- if .Values.postgresql.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "metapharm-connect.fullname" . }}-postgresql
  labels:
    {{- include "metapharm-connect.serviceLabels" (dict "root" . "serviceName" "postgresql") | nindent 4 }}
spec:
  serviceName: {{ include "metapharm-connect.fullname" . }}-postgresql-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "metapharm-connect.serviceSelectorLabels" (dict "root" . "serviceName" "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "metapharm-connect.serviceSelectorLabels" (dict "root" . "serviceName" "postgresql") | nindent 8 }}
    spec:
      containers:
      - name: postgresql
        image: {{ .Values.postgresql.image.registry }}/{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}
        ports:
        - name: postgresql
          containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRES_USER
          value: {{ .Values.postgresql.auth.username | quote }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "metapharm-connect.fullname" . }}-postgresql-secret
              key: postgres-password
        - name: POSTGRES_DB
          value: {{ .Values.postgresql.auth.database | quote }}
        {{- if .Values.postgresql.primary.initdb.args }}
        - name: POSTGRES_INITDB_ARGS
          value: {{ .Values.postgresql.primary.initdb.args | quote }}
        {{- end }}
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U {{ .Values.postgresql.auth.username }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U {{ .Values.postgresql.auth.username }}
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        {{- if .Values.postgresql.primary.resources }}
        resources:
          {{- toYaml .Values.postgresql.primary.resources | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: postgres
  {{- if .Values.postgresql.primary.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
        - ReadWriteOnce
      {{- if .Values.postgresql.primary.persistence.storageClass }}
      storageClassName: {{ .Values.postgresql.primary.persistence.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.postgresql.primary.persistence.size }}
  {{- else }}
  volumes:
  - name: data
    emptyDir: {}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "metapharm-connect.fullname" . }}-postgresql
  labels:
    {{- include "metapharm-connect.serviceLabels" (dict "root" . "serviceName" "postgresql") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
  selector:
    {{- include "metapharm-connect.serviceSelectorLabels" (dict "root" . "serviceName" "postgresql") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "metapharm-connect.fullname" . }}-postgresql-headless
  labels:
    {{- include "metapharm-connect.serviceLabels" (dict "root" . "serviceName" "postgresql") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
  selector:
    {{- include "metapharm-connect.serviceSelectorLabels" (dict "root" . "serviceName" "postgresql") | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "metapharm-connect.fullname" . }}-postgresql-secret
  labels:
    {{- include "metapharm-connect.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.postgresql.auth.password | quote }}
{{- end }}
