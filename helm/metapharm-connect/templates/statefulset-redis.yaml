{{- if .Values.redis.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "metapharm-connect.fullname" . }}-redis-master
  labels:
    {{- include "metapharm-connect.serviceLabels" (dict "root" . "serviceName" "redis-master") | nindent 4 }}
spec:
  serviceName: {{ include "metapharm-connect.fullname" . }}-redis-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "metapharm-connect.serviceSelectorLabels" (dict "root" . "serviceName" "redis-master") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "metapharm-connect.serviceSelectorLabels" (dict "root" . "serviceName" "redis-master") | nindent 8 }}
    spec:
      containers:
      - name: redis
        image: {{ .Values.redis.image.registry }}/{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}
        command:
          - redis-server
          - --appendonly
          - "yes"
          {{- if .Values.redis.auth.enabled }}
          - --requirepass
          - $(REDIS_PASSWORD)
          {{- end }}
        ports:
        - name: redis
          containerPort: 6379
          protocol: TCP
        env:
        {{- if .Values.redis.auth.enabled }}
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "metapharm-connect.fullname" . }}-redis-secret
              key: redis-password
        {{- end }}
        livenessProbe:
          exec:
            command:
              - redis-cli
              {{- if .Values.redis.auth.enabled }}
              - -a
              - $(REDIS_PASSWORD)
              {{- end }}
              - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
              - redis-cli
              {{- if .Values.redis.auth.enabled }}
              - -a
              - $(REDIS_PASSWORD)
              {{- end }}
              - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 5
        {{- if .Values.redis.master.resources }}
        resources:
          {{- toYaml .Values.redis.master.resources | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: data
          mountPath: /data
  {{- if .Values.redis.master.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
        - ReadWriteOnce
      {{- if .Values.redis.master.persistence.storageClass }}
      storageClassName: {{ .Values.redis.master.persistence.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.redis.master.persistence.size }}
  {{- else }}
  volumes:
  - name: data
    emptyDir: {}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "metapharm-connect.fullname" . }}-redis-master
  labels:
    {{- include "metapharm-connect.serviceLabels" (dict "root" . "serviceName" "redis-master") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "metapharm-connect.serviceSelectorLabels" (dict "root" . "serviceName" "redis-master") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "metapharm-connect.fullname" . }}-redis-headless
  labels:
    {{- include "metapharm-connect.serviceLabels" (dict "root" . "serviceName" "redis-master") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "metapharm-connect.serviceSelectorLabels" (dict "root" . "serviceName" "redis-master") | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "metapharm-connect.fullname" . }}-redis-secret
  labels:
    {{- include "metapharm-connect.labels" . | nindent 4 }}
type: Opaque
stringData:
  redis-password: {{ .Values.redis.auth.password | quote }}
{{- end }}
