  adherenceService:
    replicaCount: 2
  digitalTwinService:
    replicaCount: 2
  subscriptionService:
    replicaCount: 2

# Frontend services for production
frontend:
  web:
    replicaCount: 3
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
  mobile:
    replicaCount: 3
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
  dashboard:
    replicaCount: 2
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

# Configuration for production
config:
  database:
    url: "postgresql://metapharm:password_from_secret@postgresql:5432/metapharm_db"
    maxConnections: 500
  redis:
    url: "redis://:password_from_secret@redis:6379"
  logging:
    level: "info"
    format: "json"

# Pod disruption budgets for production
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Network policies for production
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

# Security settings for production
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
