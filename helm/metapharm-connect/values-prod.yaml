    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
  prescriptionService:
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
  teleconsultationService:
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
  inventoryService:
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
  analyticsService:
    replicaCount: 2
  deliveryService:
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
  ecommerceService:
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
  paymentService:
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
  messagingService:
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
  notificationService:
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
  doctorService:
    replicaCount: 3
  nurseService:
    replicaCount: 3
  patientService:
    replicaCount: 3
  appointmentService:
    replicaCount: 3
  medicalRecordsService:
    replicaCount: 3
  insuranceService:
    replicaCount: 3
  esanteService:
    replicaCount: 3
  vipService:
    replicaCount: 2
  marketingService:
    replicaCount: 2
  refillService:
    replicaCount: 3
  voiceService:
    replicaCount: 3
  controlledSubstanceService:
    replicaCount: 3
  orderService:
    replicaCount: 3
  recyclingService:
