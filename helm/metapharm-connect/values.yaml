# Default values for metapharm-connect
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings applied to all services
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Image settings
image:
  registry: docker.io
  repository: metapharm
  pullPolicy: IfNotPresent
  tag: "1.0.0"

# Name override
nameOverride: ""
fullnameOverride: ""

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext:
  fsGroup: 2000

# Security context
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: api.metapharm.local
      paths:
        - path: /
          pathType: Prefix
          backend: api-gateway
  tls:
    - secretName: metapharm-tls
      hosts:
        - api.metapharm.local

# Resource defaults (can be overridden per service)
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# ========================================
# Infrastructure Services
# ========================================

postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: postgres
    tag: "16-alpine"
  auth:
    username: metapharm
    password: metapharm_dev_password
    database: metapharm_db
  primary:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi
    initdb:
      args: "-c max_connections=200"
  readReplicas:
    replicaCount: 0

redis:
  enabled: true
  image:
    registry: docker.io
    repository: redis
    tag: "7-alpine"
  auth:
    enabled: true
    password: "redis_dev_password"
  master:
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ""
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
  replica:
    replicaCount: 0

jaeger:
  enabled: true
  image:
    registry: docker.io
    repository: jaegertracing/all-in-one
    tag: "latest"
  collector:
    otlp:
      enabled: true
  query:
    service:
      type: ClusterIP
      port: 16686
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# ========================================
