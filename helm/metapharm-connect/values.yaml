# ========================================
# Configuration
# ========================================

config:
  # Database configuration
  database:
    url: "postgresql://metapharm:metapharm_dev_password@postgresql:5432/metapharm_db"
    maxConnections: 200

  # Redis configuration
  redis:
    url: "redis://:redis_dev_password@redis:6379"

  # JWT configuration
  jwt:
    secret: "dev-secret-key-change-in-production"
    expiresIn: "1h"
    refreshExpiresIn: "7d"

  # Observability
  tracing:
    enabled: true
    otlpExporterUrl: "http://jaeger:4318/v1/traces"

  # Logging
  logging:
    level: "info"
    format: "json"

# ========================================
# Secrets (should be stored in Kubernetes secrets)
# ========================================

secrets:
  # These should be overridden in production
  postgresql:
    password: "changeme"
  redis:
    password: "changeme"
  jwt:
    secret: "changeme"
  # Add other secrets as needed
  stripe:
    apiKey: "changeme"
  sendgrid:
    apiKey: "changeme"
  twilio:
    accountSid: "changeme"
    authToken: "changeme"
