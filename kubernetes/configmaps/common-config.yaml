apiVersion: v1
kind: ConfigMap
metadata:
  name: common-config
  namespace: metapharm
  labels:
    app: metapharm-connect
    component: configuration
data:
  # Node environment
  NODE_ENV: "production"

  # Logging
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

  # API Gateway URL
  API_GATEWAY_URL: "http://api-gateway-svc.metapharm.svc.cluster.local:3000"

  # Database connection (host only, credentials in secrets)
  DB_HOST: "postgres-primary-svc.metapharm.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "metapharm_db"

  # Redis cache
  REDIS_HOST: "redis-svc.metapharm.svc.cluster.local"
  REDIS_PORT: "6379"

  # RabbitMQ
  RABBITMQ_HOST: "rabbitmq-svc.metapharm.svc.cluster.local"
  RABBITMQ_PORT: "5672"

  # Elasticsearch
  ELASTICSEARCH_HOST: "elasticsearch-svc.metapharm.svc.cluster.local"
  ELASTICSEARCH_PORT: "9200"

  # Rate limiting
  RATE_LIMIT_WINDOW: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"

  # JWT
  JWT_EXPIRY: "3600"
  JWT_REFRESH_EXPIRY: "604800"

  # CORS
  CORS_ORIGIN: "*"

  # Health check intervals
  HEALTH_CHECK_INTERVAL: "30"

  # Feature flags
  FEATURE_AI_OCR: "true"
  FEATURE_DRUG_INTERACTION: "true"
  FEATURE_TELECONSULTATION: "true"
  FEATURE_DELIVERY_TRACKING: "true"
