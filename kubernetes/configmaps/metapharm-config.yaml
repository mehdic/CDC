# MetaPharm Connect - Configuration
# Non-sensitive configuration values
apiVersion: v1
kind: ConfigMap
metadata:
  name: metapharm-config
  namespace: metapharm
  labels:
    app.kubernetes.io/name: metapharm
    app.kubernetes.io/part-of: metapharm-connect
data:
  # Application environment
  NODE_ENV: "production"
  LOG_LEVEL: "info"

  # Service ports
  WEB_PORT: "80"
  API_PORT: "4000"

  # Feature flags
  FEATURE_TELECONSULTATION: "true"
  FEATURE_VIP_PROGRAM: "true"
  FEATURE_AI_PRESCRIPTIONS: "true"
  FEATURE_DIGITAL_TWIN: "true"
  FEATURE_ESANTE_INTEGRATION: "false"

  # API configuration
  API_TIMEOUT_MS: "30000"
  API_RATE_LIMIT: "100"

  # Observability
  OTLP_EXPORTER_URL: "http://jaeger:4318/v1/traces"
  METRICS_ENABLED: "true"
  TRACING_ENABLED: "true"

  # Cache configuration
  CACHE_TTL_SECONDS: "300"
  SESSION_TTL_SECONDS: "3600"

  # Healthcare compliance
  AUDIT_LOGGING_ENABLED: "true"
  DATA_RETENTION_DAYS: "365"
  ENCRYPTION_REQUIRED: "true"

  # API URLs
  VITE_API_URL: "https://api.metapharm.ch"
  VITE_API_GATEWAY: "https://api.metapharm.ch/api"
