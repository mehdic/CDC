apiVersion: v1
kind: ConfigMap
metadata:
  name: common-config
data:
  # Database configuration
  DATABASE_HOST: postgres-svc.metapharm.svc.cluster.local
  DATABASE_PORT: "5432"
  DATABASE_NAME: metapharm_db

  # Redis configuration
  REDIS_HOST: redis-svc.metapharm.svc.cluster.local
  REDIS_PORT: "6379"

  # Application configuration
  LOG_LEVEL: info
  NODE_ENV: production

  # Tracing configuration
  JAEGER_ENABLED: "true"
  OTLP_EXPORTER_URL: http://jaeger:4318/v1/traces

  # API Gateway configuration
  GATEWAY_URL: http://api-gateway-svc:3000
  AUTH_SERVICE_URL: http://auth-service-svc:3001
  PRESCRIPTION_SERVICE_URL: http://prescription-service-svc:3009
