apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metapharm-ingress
  annotations:
    # Ingress class (nginx, traefik, etc.)
    kubernetes.io/ingress.class: nginx

    # TLS configuration
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # Security headers
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"

    # CORS configuration (for API)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://metapharm.ch"

    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"

    # Proxy settings
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

spec:
  tls:
  - hosts:
    - api.metapharm.ch
    - app.metapharm.ch
    secretName: metapharm-tls-secret  # Managed by cert-manager

  rules:
  # API Gateway
  - host: api.metapharm.ch
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway-svc
            port:
              number: 3000

  # Web Application
  - host: app.metapharm.ch
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-frontend-svc
            port:
              number: 3000
---
