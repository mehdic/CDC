apiVersion: v1
kind: Service
metadata:
  name: voice-service-svc
  namespace: metapharm
  labels:
    app: voice-service
    service: 'true'
  annotations:
    service.kubernetes.io/topology-aware-hints: auto
spec:
  selector:
    app: voice-service
  ports:
  - name: http
    protocol: TCP
    port: 3029
    targetPort: http
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  type: ClusterIP
