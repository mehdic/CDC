apiVersion: v1
kind: Service
metadata:
  name: redis-svc
  namespace: metapharm
  labels:
    app: redis
    service: 'true'
  annotations:
    service.kubernetes.io/topology-aware-hints: auto
spec:
  selector:
    app: redis
  ports:
  - name: http
    protocol: TCP
    port: 6379
    targetPort: http
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  type: ClusterIP
