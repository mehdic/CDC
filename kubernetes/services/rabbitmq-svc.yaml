apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-svc
  namespace: metapharm
  labels:
    app: rabbitmq
    service: 'true'
  annotations:
    service.kubernetes.io/topology-aware-hints: auto
spec:
  selector:
    app: rabbitmq
  ports:
  - name: http
    protocol: TCP
    port: 5672
    targetPort: http
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  type: ClusterIP
