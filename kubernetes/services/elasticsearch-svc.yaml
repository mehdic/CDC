apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-svc
  namespace: metapharm
  labels:
    app: elasticsearch
    service: 'true'
  annotations:
    service.kubernetes.io/topology-aware-hints: auto
spec:
  selector:
    app: elasticsearch
  ports:
  - name: http
    protocol: TCP
    port: 9200
    targetPort: http
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  type: ClusterIP
