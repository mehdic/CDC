apiVersion: v1
kind: Service
metadata:
  name: api-gateway-svc
  namespace: metapharm
  labels:
    app: api-gateway
    service: 'true'
  annotations:
    service.kubernetes.io/topology-aware-hints: auto
spec:
  selector:
    app: api-gateway
  ports:
  - name: http
    protocol: TCP
    port: 3000
    targetPort: http
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  type: LoadBalancer
