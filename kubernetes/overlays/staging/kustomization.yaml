apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: metapharm-staging

bases:
  - ../../base

namespace: metapharm-staging

commonLabels:
  environment: staging
  managed-by: kustomize

commonAnnotations:
  environment: staging

# Staging uses release candidate tags
images:
  - name: metapharm/api-gateway
    newTag: v1.0.0-rc
  - name: metapharm/auth-service
    newTag: v1.0.0-rc
  - name: metapharm/prescription-service
    newTag: v1.0.0-rc

# Medium replicas for staging
replicas:
  - name: api-gateway-deployment
    count: 2
  - name: auth-service-deployment
    count: 2
  - name: prescription-service-deployment
    count: 2

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
      - NODE_ENV=staging
      - JAEGER_ENABLED=true

patchesStrategicMerge:
  - patches/resources-staging.yaml
  - patches/hpa-staging.yaml
  - patches/storage-staging.yaml
