apiVersion: apps/v1
kind: Deployment
metadata:
  name: recycling-service-deployment
  namespace: metapharm
  labels:
    app: recycling-service
    tier: low
    component: microservice
    version: v1
  annotations:
    deployment.kubernetes.io/revision: '1'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recycling-service
      version: v1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: recycling-service
        tier: low
        version: v1
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3025'
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: recycling-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: recycling-service
        image: metapharm/recycling-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3025
          protocol: TCP
        env:
        - name: PORT
          value: '3025'
        - name: SERVICE_NAME
          value: recycling-service
        envFrom:
        - configMapRef:
            name: common-config
        - secretRef:
            name: metapharm-db-credentials
        - secretRef:
            name: metapharm-jwt-secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
