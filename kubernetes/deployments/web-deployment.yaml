# MetaPharm Connect - Web Frontend Deployment
# Production-grade deployment with security, HA, and observability
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  namespace: metapharm
  labels:
    app.kubernetes.io/name: metapharm-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: metapharm-connect
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: metapharm-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metapharm-web
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: metapharm-connect
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
    spec:
      serviceAccountName: metapharm-web
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: metapharm-web
                topologyKey: kubernetes.io/hostname

      containers:
        - name: web
          image: ghcr.io/mehdic/cdc/web:latest
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          envFrom:
            - configMapRef:
                name: metapharm-config

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run

      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}

      terminationGracePeriodSeconds: 30

      imagePullSecrets:
        - name: metapharm-registry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metapharm-web
  namespace: metapharm
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: metapharm-web-pdb
  namespace: metapharm
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metapharm-web
