apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging-service-deployment
  namespace: metapharm
  labels:
    app: messaging-service
    tier: high
    component: microservice
    version: v1
  annotations:
    deployment.kubernetes.io/revision: '1'
spec:
  replicas: 3
  selector:
    matchLabels:
      app: messaging-service
      version: v1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: messaging-service
        tier: high
        version: v1
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3005'
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: messaging-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: messaging-service
        image: metapharm/messaging-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3005
          protocol: TCP
        env:
        - name: PORT
          value: '3005'
        - name: SERVICE_NAME
          value: messaging-service
        envFrom:
        - configMapRef:
            name: common-config
        - secretRef:
            name: metapharm-db-credentials
        - secretRef:
            name: metapharm-jwt-secret
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - messaging-service
              topologyKey: kubernetes.io/hostname
