# Infrastructure services
infrastructure:
  # PostgreSQL Primary Database
  postgresPrimary:
    enabled: true
    name: postgres-primary
    tier: high
    component: infrastructure
    port: 5432
    replicas: 1
    serviceType: ClusterIP
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
    storage:
      size: 20Gi
      storageClass: standard

  # PostgreSQL Replica
  postgresReplica:
    enabled: true
    name: postgres-replica
    tier: high
    component: infrastructure
    port: 5432
    replicas: 2
    serviceType: ClusterIP
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
    storage:
      size: 20Gi
      storageClass: standard

  # Redis Cache
  redis:
    enabled: true
    name: redis
    tier: medium
    component: infrastructure
    port: 6379
    replicas: 2
    serviceType: ClusterIP
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

  # RabbitMQ Message Queue
  rabbitmq:
    enabled: true
    name: rabbitmq
    tier: medium
    component: infrastructure
    port: 5672
    managementPort: 15672
    replicas: 2
    serviceType: ClusterIP
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

  # Elasticsearch Search Engine
  elasticsearch:
    enabled: true
    name: elasticsearch
    tier: medium
    component: infrastructure
    port: 9200
    replicas: 2
    serviceType: ClusterIP
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: 500m
        memory: 2Gi
    storage:
      size: 30Gi
      storageClass: standard

# Security context for all pods
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Health probe defaults
healthProbe:
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3

# Rolling update strategy
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Pod affinity/anti-affinity
affinity:
  podAntiAffinity:
    enabled: true
    weight: 100

# Session affinity
sessionAffinity:
  enabled: true
  type: ClientIP
  timeout: 10800

# Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.metapharm.local
      paths:
        - path: /
          pathType: Prefix
          service: api-gateway-svc
          port: 3000
  tls:
    - secretName: metapharm-tls
      hosts:
        - api.metapharm.local

# Monitoring and observability
monitoring:
  prometheus:
    enabled: true
    scrapeInterval: 30s
  metrics:
    enabled: true
    path: /metrics
