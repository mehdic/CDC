# Default values for metapharm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global configuration
global:
  # Environment: development, staging, production
  environment: development
  # Primary domain
  domain: metapharm.local
  # Image registry
  imageRegistry: metapharm
  # Image pull policy
  imagePullPolicy: IfNotPresent
  # Image tag (overrides appVersion from Chart.yaml)
  imageTag: latest
  # Namespace
  namespace: metapharm

# Namespace configuration
namespace:
  create: true
  name: metapharm
  labels:
    environment: development
    project: metapharm-connect
  annotations:
    description: "MetaPharm Connect - Healthcare Platform Namespace"

# ConfigMap configuration
configMap:
  create: true
  data:
    nodeEnv: "development"
    logLevel: "debug"
    logFormat: "json"
    rateLimitWindow: "900000"
    rateLimitMaxRequests: "100"
    jwtExpiry: "3600"
    jwtRefreshExpiry: "604800"
    corsOrigin: "*"
    healthCheckInterval: "30"
    # Feature flags
    featureAiOcr: "true"
    featureDrugInteraction: "true"
    featureTeleconsultation: "true"
    featureDeliveryTracking: "true"

# Secret configuration (not the actual secrets, just metadata)
secrets:
  # Database credentials
  dbCredentials:
    enabled: true
    name: metapharm-db-credentials
  # JWT secrets
  jwtSecret:
    enabled: true
    name: metapharm-jwt-secret
  # Redis password
  redisPassword:
    enabled: true
    name: metapharm-redis-password
  # RabbitMQ credentials
  rabbitmqCredentials:
    enabled: true
    name: metapharm-rabbitmq-credentials
  # External API keys
  externalApiKeys:
    enabled: true
    name: metapharm-external-api-keys

# Service definitions with their configurations
services:
  # API Gateway (High Tier - Critical)
  apiGateway:
    enabled: true
    name: api-gateway
    tier: high
    component: microservice
    port: 3000
    replicas: 3
    serviceType: LoadBalancer
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
      targetCPU: 70
      targetMemory: 80
    healthCheck:
      path: /health
      port: 3000

  # Auth Service (High Tier - Critical)
  authService:
    enabled: true
    name: auth-service
    tier: high
    component: microservice
    port: 3001
    replicas: 3
    serviceType: ClusterIP
