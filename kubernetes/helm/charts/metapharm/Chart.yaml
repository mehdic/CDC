      description: Initial Helm chart for MetaPharm Connect platform

  # License information
  artifacthub.io/license: Proprietary

  # Support links
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.metapharm.ch
    - name: Support
      url: https://support.metapharm.ch
