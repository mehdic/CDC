apiVersion: v2
name: metapharm
description: MetaPharm Connect - Comprehensive Healthcare Platform Helm Chart
type: application

# Chart version - increment on changes to the chart
version: 1.0.0

# Application version - the version of the MetaPharm platform
appVersion: "1.0.0"

keywords:
  - healthcare
  - pharmacy
  - telemedicine
  - microservices
  - metapharm

maintainers:
