{{/*
Note: These secret templates are placeholders for structure.
Actual secret values should be provided externally via:
1. External secret management (Sealed Secrets, External Secrets Operator)
2. Helm --set flags
3. CI/CD pipeline secret injection
4. Manual kubectl create secret commands

DO NOT commit actual secret values to Git.
*/}}

{{- if .Values.secrets.dbCredentials.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.dbCredentials.name }}
  namespace: {{ include "metapharm.namespace" . }}
  labels:
    app: metapharm-connect
    component: secrets
    {{- include "metapharm.labels" . | nindent 4 }}
type: Opaque
data:
  # Base64 encoded values - provide via --set-file or external secret manager
  # Example: kubectl create secret generic metapharm-db-credentials \
  #   --from-literal=DB_USER=postgres \
  #   --from-literal=DB_PASSWORD=secretpassword \
  #   -n metapharm
  DB_USER: {{ .Values.secrets.dbCredentials.user | default "" | b64enc }}
  DB_PASSWORD: {{ .Values.secrets.dbCredentials.password | default "" | b64enc }}
{{- end }}

{{- if .Values.secrets.jwtSecret.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.jwtSecret.name }}
  namespace: {{ include "metapharm.namespace" . }}
  labels:
    app: metapharm-connect
    component: secrets
    {{- include "metapharm.labels" . | nindent 4 }}
type: Opaque
data:
  # Base64 encoded values
  JWT_SECRET: {{ .Values.secrets.jwtSecret.secret | default "" | b64enc }}
  JWT_REFRESH_SECRET: {{ .Values.secrets.jwtSecret.refreshSecret | default "" | b64enc }}
{{- end }}

{{- if .Values.secrets.redisPassword.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.redisPassword.name }}
  namespace: {{ include "metapharm.namespace" . }}
  labels:
    app: metapharm-connect
    component: secrets
    {{- include "metapharm.labels" . | nindent 4 }}
type: Opaque
data:
  # Base64 encoded values
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword.password | default "" | b64enc }}
{{- end }}

{{- if .Values.secrets.rabbitmqCredentials.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.rabbitmqCredentials.name }}
  namespace: {{ include "metapharm.namespace" . }}
  labels:
    app: metapharm-connect
    component: secrets
    {{- include "metapharm.labels" . | nindent 4 }}
type: Opaque
data:
  # Base64 encoded values
  RABBITMQ_USER: {{ .Values.secrets.rabbitmqCredentials.user | default "" | b64enc }}
  RABBITMQ_PASSWORD: {{ .Values.secrets.rabbitmqCredentials.password | default "" | b64enc }}
{{- end }}

{{- if .Values.secrets.externalApiKeys.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.externalApiKeys.name }}
  namespace: {{ include "metapharm.namespace" . }}
  labels:
    app: metapharm-connect
    component: secrets
    {{- include "metapharm.labels" . | nindent 4 }}
type: Opaque
data:
  # External service API keys (Base64 encoded)
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.externalApiKeys.awsAccessKeyId | default "" | b64enc }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.externalApiKeys.awsSecretAccessKey | default "" | b64enc }}
  TWILIO_ACCOUNT_SID: {{ .Values.secrets.externalApiKeys.twilioAccountSid | default "" | b64enc }}
  TWILIO_AUTH_TOKEN: {{ .Values.secrets.externalApiKeys.twilioAuthToken | default "" | b64enc }}
  SENDGRID_API_KEY: {{ .Values.secrets.externalApiKeys.sendgridApiKey | default "" | b64enc }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.externalApiKeys.stripeSecretKey | default "" | b64enc }}
  HIN_CLIENT_ID: {{ .Values.secrets.externalApiKeys.hinClientId | default "" | b64enc }}
  HIN_CLIENT_SECRET: {{ .Values.secrets.externalApiKeys.hinClientSecret | default "" | b64enc }}
{{- end }}
