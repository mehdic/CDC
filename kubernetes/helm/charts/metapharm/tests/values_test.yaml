suite: test values files
templates:
  - namespace.yaml
  - configmaps/common-config.yaml
tests:
  # Test namespace creation
  - it: should create namespace when enabled
    set:
      namespace.create: true
      namespace.name: metapharm
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Namespace
      - equal:
          path: metadata.name
          value: metapharm

  # Test ConfigMap creation
  - it: should create ConfigMap with correct data
    template: configmaps/common-config.yaml
    set:
      configMap.create: true
      configMap.data.nodeEnv: "production"
      configMap.data.logLevel: "info"
      global.namespace: metapharm
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: data.NODE_ENV
          value: "production"
      - equal:
          path: data.LOG_LEVEL
          value: "info"

  # Test environment-specific values (dev)
  - it: should use development settings with values-dev
    values:
      - ../values-dev.yaml
    template: configmaps/common-config.yaml
    asserts:
      - equal:
          path: data.NODE_ENV
          value: "development"
      - equal:
          path: data.LOG_LEVEL
          value: "debug"

  # Test environment-specific values (prod)
  - it: should use production settings with values-prod
    values:
      - ../values-prod.yaml
    template: configmaps/common-config.yaml
    asserts:
      - equal:
          path: data.NODE_ENV
          value: "production"
      - equal:
          path: data.LOG_LEVEL
          value: "info"
