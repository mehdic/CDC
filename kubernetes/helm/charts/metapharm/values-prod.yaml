# Production infrastructure
infrastructure:
  postgresPrimary:
    replicas: 1
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
    storage:
      size: 100Gi
      storageClass: premium

  postgresReplica:
    enabled: true
    replicas: 2
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
    storage:
      size: 100Gi
      storageClass: premium

  redis:
    replicas: 2
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

  rabbitmq:
    replicas: 2
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

  elasticsearch:
    replicas: 2
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: 500m
        memory: 2Gi
    storage:
      size: 50Gi
      storageClass: premium

# Production ingress with TLS
ingress:
  enabled: true
  hosts:
    - host: api.metapharm.ch
      paths:
        - path: /
          pathType: Prefix
          service: api-gateway-svc
          port: 3000
  tls:
    - secretName: metapharm-prod-tls
      hosts:
        - api.metapharm.ch
