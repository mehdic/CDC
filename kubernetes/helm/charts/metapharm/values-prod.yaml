# Production environment specific values
global:
  environment: production
  domain: metapharm.ch
  imageTag: v1.0.0
  imagePullPolicy: IfNotPresent

namespace:
  labels:
    environment: production

configMap:
  data:
    nodeEnv: "production"
    logLevel: "info"
    logFormat: "json"
    corsOrigin: "https://metapharm.ch,https://app.metapharm.ch"

# Full production resources
services:
  apiGateway:
    replicas: 3
    serviceType: LoadBalancer
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
      targetCPU: 70
      targetMemory: 80

