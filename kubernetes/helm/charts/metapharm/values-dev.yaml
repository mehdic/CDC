# Reduced infrastructure resources for development
infrastructure:
  postgresPrimary:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 512Mi
    storage:
      size: 5Gi

  postgresReplica:
    enabled: false

  redis:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 256Mi

  rabbitmq:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 256Mi

  elasticsearch:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 512Mi
    storage:
      size: 5Gi

# Development ingress
ingress:
  enabled: true
  hosts:
    - host: api.metapharm-dev.local
      paths:
        - path: /
          pathType: Prefix
          service: api-gateway-svc
          port: 3000
  tls: []
