# Development environment specific values
global:
  environment: development
  domain: metapharm-dev.local
  imageTag: latest
  imagePullPolicy: Always

namespace:
  labels:
    environment: development

configMap:
  data:
    nodeEnv: "development"
    logLevel: "debug"
    logFormat: "pretty"
    corsOrigin: "*"

# Reduced resource requests for development
services:
  apiGateway:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    autoscaling:
      enabled: false

  authService:
    replicas: 1
    resources:
      requests:
        cpu: 100m
