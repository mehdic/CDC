# Staging infrastructure
infrastructure:
  postgresPrimary:
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storage:
      size: 10Gi

  postgresReplica:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storage:
      size: 10Gi

  redis:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 512Mi

  rabbitmq:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 512Mi

  elasticsearch:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 250m
        memory: 1Gi
    storage:
      size: 15Gi

# Staging ingress with TLS
ingress:
  enabled: true
  hosts:
    - host: api.metapharm-staging.ch
      paths:
        - path: /
          pathType: Prefix
          service: api-gateway-svc
          port: 3000
  tls:
    - secretName: metapharm-staging-tls
      hosts:
        - api.metapharm-staging.ch
