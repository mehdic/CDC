# Staging environment specific values
global:
  environment: staging
  domain: metapharm-staging.ch
  imageTag: staging
  imagePullPolicy: IfNotPresent

namespace:
  labels:
    environment: staging

configMap:
  data:
    nodeEnv: "staging"
    logLevel: "info"
    logFormat: "json"
    corsOrigin: "https://staging.metapharm.ch"

# Moderate resources for staging (between dev and prod)
services:
  apiGateway:
    replicas: 2
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPU: 75

  authService:
