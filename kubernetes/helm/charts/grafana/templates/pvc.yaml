{{- if and .Values.grafana.enabled .Values.grafana.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.grafana.name }}-pvc
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ .Values.grafana.name }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.grafana.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.grafana.persistence.size }}
{{- end }}
