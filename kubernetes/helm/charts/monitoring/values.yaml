# Default values for metapharm-monitoring
# This is a YAML-formatted file.

# Global configuration
global:
  # Environment: development, staging, production
  environment: development
  # Namespace where monitoring stack will be deployed
  namespace: metapharm-monitoring
  # Namespace where MetaPharm services are deployed
  servicesNamespace: metapharm

# Namespace configuration
namespace:
  create: true
  name: metapharm-monitoring
  labels:
    name: metapharm-monitoring
    environment: development

# Prometheus configuration
prometheus:
  enabled: true
  # Prometheus server image
  image:
    repository: prom/prometheus
    tag: v2.48.0
    pullPolicy: IfNotPresent

  # Prometheus server resources
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

  # Prometheus replicas for high availability
  replicas: 2

  # Service configuration
  service:
    type: ClusterIP
    port: 9090
    targetPort: 9090
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9090"

  # Persistent storage configuration
  storage:
    enabled: true
    size: 50Gi
    storageClass: standard
    # Retention period: 15 days
    retention: 15d
    retentionSize: 45GB

  # Scrape configuration
  scrapeInterval: 15s
  scrapeTimeout: 10s
  evaluationInterval: 15s

  # External labels for federated setup
  externalLabels:
    cluster: metapharm
    environment: development
    platform: healthcare

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    fsGroup: 65534
    allowPrivilegeEscalation: false

  # Service discovery for MetaPharm services
  serviceDiscovery:
    enabled: true
    namespaces:
      - metapharm
      - metapharm-monitoring

# AlertManager configuration
alertmanager:
  enabled: true
  # AlertManager image
  image:
    repository: prom/alertmanager
    tag: v0.26.0
    pullPolicy: IfNotPresent

  # AlertManager resources
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # AlertManager replicas for high availability
  replicas: 2

  # Service configuration
  service:
    type: ClusterIP
    port: 9093
    targetPort: 9093

  # Persistent storage
  storage:
    enabled: true
    size: 2Gi
    storageClass: standard

  # Notification configuration
  notifications:
    # Slack integration
    slack:
      enabled: true
      webhookUrl: "" # Set via secret
      channel: "#metapharm-alerts"
      sendResolved: true
      title: "MetaPharm Alert"
      titleLink: "https://prometheus.metapharm.local"

    # Email integration
    email:
      enabled: false
      from: "alerts@metapharm.ch"
      to: "devops@metapharm.ch"
      smarthost: "smtp.metapharm.ch:587"
      requireTLS: true

    # PagerDuty integration (for critical alerts)
    pagerduty:
      enabled: false
      serviceKey: "" # Set via secret
      severity: critical

  # Alert grouping configuration
  grouping:
    groupBy:
      - alertname
      - cluster
      - service
    groupWait: 10s
    groupInterval: 5m
    repeatInterval: 4h

# ServiceMonitor configuration for all MetaPharm services
