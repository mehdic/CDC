{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.global.namespace }}
  labels:
    app: prometheus
    component: monitoring
data:
  prometheus.yml: |
    # Prometheus configuration for MetaPharm Connect
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
      scrape_timeout: {{ .Values.prometheus.scrapeTimeout }}
      evaluation_interval: {{ .Values.prometheus.evaluationInterval }}
      external_labels:
        {{- with .Values.prometheus.externalLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

    # Alerting configuration
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093
          path_prefix: /
          scheme: http

    # Load alerting rules
    rule_files:
      - '/etc/prometheus/rules/*.yml'

    # Scrape configurations
    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
            labels:
              component: monitoring
              tier: infrastructure

      # AlertManager monitoring
      - job_name: 'alertmanager'
        static_configs:
          - targets: ['alertmanager:9093']
            labels:
              component: monitoring
              tier: infrastructure

      {{- if .Values.serviceMonitors.enabled }}
      # MetaPharm microservices - High Tier (Critical)
      - job_name: 'metapharm-api-gateway'
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names:
                - {{ .Values.global.servicesNamespace }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: api-gateway-svc
          - source_labels: [__meta_kubernetes_service_label_tier]
            target_label: tier
          - target_label: service
            replacement: api-gateway
        metrics_path: /metrics
        scrape_interval: 10s

      - job_name: 'metapharm-auth-service'
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names:
                - {{ .Values.global.servicesNamespace }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: auth-service-svc
          - source_labels: [__meta_kubernetes_service_label_tier]
            target_label: tier
          - target_label: service
            replacement: auth-service
        metrics_path: /metrics
        scrape_interval: 10s

      - job_name: 'metapharm-prescription-service'
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names:
                - {{ .Values.global.servicesNamespace }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: prescription-service-svc
          - source_labels: [__meta_kubernetes_service_label_tier]
            target_label: tier
          - target_label: service
            replacement: prescription-service
        metrics_path: /metrics
        scrape_interval: 10s

      - job_name: 'metapharm-medical-records-service'
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names:
                - {{ .Values.global.servicesNamespace }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: medical-records-service-svc
          - source_labels: [__meta_kubernetes_service_label_tier]
            target_label: tier
          - target_label: service
            replacement: medical-records-service
        metrics_path: /metrics
        scrape_interval: 10s

      - job_name: 'metapharm-messaging-service'
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names:
                - {{ .Values.global.servicesNamespace }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: messaging-service-svc
          - source_labels: [__meta_kubernetes_service_label_tier]
            target_label: tier
          - target_label: service
            replacement: messaging-service
        metrics_path: /metrics
        scrape_interval: 10s

      - job_name: 'metapharm-payment-service'
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names:
                - {{ .Values.global.servicesNamespace }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: payment-service-svc
          - source_labels: [__meta_kubernetes_service_label_tier]
            target_label: tier
          - target_label: service
            replacement: payment-service
        metrics_path: /metrics
        scrape_interval: 10s

      - job_name: 'metapharm-teleconsultation-service'
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names:
                - {{ .Values.global.servicesNamespace }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: teleconsultation-service-svc
          - source_labels: [__meta_kubernetes_service_label_tier]
            target_label: tier
          - target_label: service
            replacement: teleconsultation-service
        metrics_path: /metrics
        scrape_interval: 10s

      - job_name: 'metapharm-digital-twin-service'
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names:
                - {{ .Values.global.servicesNamespace }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: digital-twin-service-svc
          - source_labels: [__meta_kubernetes_service_label_tier]
            target_label: tier
          - target_label: service
            replacement: digital-twin-service
        metrics_path: /metrics
        scrape_interval: 10s

      - job_name: 'metapharm-drug-interaction-service'
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names:
                - {{ .Values.global.servicesNamespace }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: drug-interaction-service-svc
          - source_labels: [__meta_kubernetes_service_label_tier]
            target_label: tier
          - target_label: service
            replacement: drug-interaction-service
        metrics_path: /metrics
        scrape_interval: 10s

      # MetaPharm microservices - Medium Tier
      {{- range .Values.serviceMonitors.services }}
      {{- if eq .tier "medium" }}
      - job_name: 'metapharm-{{ .name }}'
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names:
                - {{ $.Values.global.servicesNamespace }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: {{ .name }}-svc
          - source_labels: [__meta_kubernetes_service_label_tier]
            target_label: tier
          - target_label: service
            replacement: {{ .name }}
        metrics_path: {{ .path }}
        scrape_interval: {{ $.Values.serviceMonitors.interval }}
      {{- end }}
      {{- end }}

      # MetaPharm microservices - Low Tier
      {{- range .Values.serviceMonitors.services }}
      {{- if eq .tier "low" }}
      - job_name: 'metapharm-{{ .name }}'
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names:
                - {{ $.Values.global.servicesNamespace }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: {{ .name }}-svc
          - source_labels: [__meta_kubernetes_service_label_tier]
            target_label: tier
          - target_label: service
            replacement: {{ .name }}
        metrics_path: {{ .path }}
        scrape_interval: 30s
      {{- end }}
      {{- end }}

      # Infrastructure services
      {{- range .Values.serviceMonitors.infrastructure }}
      - job_name: 'infrastructure-{{ .name }}'
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names:
                - {{ $.Values.global.servicesNamespace }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: {{ .name }}-svc
          - target_label: service
            replacement: {{ .name }}
        metrics_path: {{ .path }}
        scrape_interval: {{ $.Values.serviceMonitors.interval }}
      {{- end }}
      {{- end }}

      # Kubernetes API server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # Kubernetes nodes
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # Kubernetes pods
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - {{ .Values.global.servicesNamespace }}
                - {{ .Values.global.namespace }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
{{- end }}
