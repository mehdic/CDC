{{- if .Values.prometheusRules.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: {{ .Values.global.namespace }}
  labels:
    app: prometheus
    component: monitoring
data:
  # Service availability rules
  service-availability.yml: |
    groups:
      - name: service-availability
        interval: 30s
        rules:
          - alert: ServiceDown
            expr: up{job=~"metapharm-.*"} == 0
            for: 1m
            labels:
              severity: critical
              category: availability
            annotations:
              summary: "MetaPharm service is down"
              description: "Service {{ "{{" }} $labels.job {{ "}}" }} in namespace {{ "{{" }} $labels.namespace {{ "}}" }} has been down for more than 1 minute."
              runbook_url: "https://docs.metapharm.ch/runbooks/service-down"

          - alert: HighServiceErrorRate
            expr: rate(http_requests_total{status=~"5..", job=~"metapharm-.*"}[5m]) > 0.1
            for: 5m
            labels:
              severity: critical
              category: errors
            annotations:
              summary: "High error rate detected"
              description: "Service {{ "{{" }} $labels.job {{ "}}" }} has error rate of {{ "{{" }} $value {{ "}}" }} (>10%) over the last 5 minutes."
              runbook_url: "https://docs.metapharm.ch/runbooks/high-error-rate"

  # Performance rules
  performance.yml: |
    groups:
      - name: performance
        interval: 30s
        rules:
          - alert: HighLatency
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job=~"metapharm-.*"}[5m])) > 2
            for: 5m
            labels:
              severity: warning
              category: performance
            annotations:
              summary: "High latency detected"
              description: "Service {{ "{{" }} $labels.job {{ "}}" }} has 95th percentile latency of {{ "{{" }} $value {{ "}}" }}s (>2s) over the last 5 minutes."
              runbook_url: "https://docs.metapharm.ch/runbooks/high-latency"

          - alert: CriticalLatency
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job=~"metapharm-.*"}[5m])) > 5
            for: 2m
            labels:
              severity: critical
              category: performance
            annotations:
              summary: "Critical latency detected"
              description: "Service {{ "{{" }} $labels.job {{ "}}" }} has 95th percentile latency of {{ "{{" }} $value {{ "}}" }}s (>5s) over the last 2 minutes."
              runbook_url: "https://docs.metapharm.ch/runbooks/critical-latency"

  # Healthcare-specific rules
  healthcare-critical.yml: |
    groups:
      - name: healthcare-critical
        interval: 15s
        rules:
          - alert: PrescriptionProcessingFailure
            expr: rate(prescription_processing_errors_total[5m]) > 0.05
            for: 2m
            labels:
              severity: critical
              category: healthcare
              compliance: hipaa
            annotations:
              summary: "Prescription processing failures detected"
              description: "Prescription service is experiencing {{ "{{" }} $value {{ "}}" }} errors per second. This is a patient safety issue."
              runbook_url: "https://docs.metapharm.ch/runbooks/prescription-errors"

          - alert: DrugInteractionCheckFailure
            expr: rate(drug_interaction_check_errors_total[5m]) > 0
            for: 1m
            labels:
              severity: critical
              category: healthcare
              compliance: patient-safety
            annotations:
              summary: "Drug interaction check failures"
              description: "Drug interaction service is failing. This is a critical patient safety issue."
              runbook_url: "https://docs.metapharm.ch/runbooks/drug-interaction-failure"

          - alert: MedicalRecordsUnavailable
            expr: up{job="metapharm-medical-records-service"} == 0
            for: 30s
            labels:
              severity: critical
              category: healthcare
              compliance: hipaa
            annotations:
              summary: "Medical records service unavailable"
              description: "Medical records service is down. This impacts patient care."
              runbook_url: "https://docs.metapharm.ch/runbooks/medical-records-down"

          - alert: TeleconsultationServiceDown
            expr: up{job="metapharm-teleconsultation-service"} == 0
            for: 1m
            labels:
              severity: critical
              category: healthcare
            annotations:
              summary: "Teleconsultation service unavailable"
              description: "Teleconsultation service is down. Active patient consultations may be affected."
              runbook_url: "https://docs.metapharm.ch/runbooks/teleconsultation-down"

  # Security rules
  security.yml: |
    groups:
      - name: security
        interval: 30s
        rules:
          - alert: HighAuthenticationFailureRate
            expr: rate(authentication_failures_total[5m]) > 10
            for: 2m
            labels:
              severity: warning
              category: security
            annotations:
              summary: "High authentication failure rate"
              description: "Authentication service is experiencing {{ "{{" }} $value {{ "}}" }} failed attempts per second. Possible brute force attack."
              runbook_url: "https://docs.metapharm.ch/runbooks/auth-failures"

          - alert: UnauthorizedAccessAttempts
            expr: rate(http_requests_total{status="403", job=~"metapharm-.*"}[5m]) > 5
            for: 5m
            labels:
              severity: warning
              category: security
            annotations:
              summary: "High rate of unauthorized access attempts"
              description: "Service {{ "{{" }} $labels.job {{ "}}" }} is receiving {{ "{{" }} $value {{ "}}" }} unauthorized requests per second."
              runbook_url: "https://docs.metapharm.ch/runbooks/unauthorized-access"

          - alert: SuspiciousDataAccess
            expr: rate(http_requests_total{endpoint=~"/api/.*/(medical-records|prescriptions)", status="200"}[5m]) > 100
            for: 5m
            labels:
              severity: warning
              category: security
              compliance: hipaa
            annotations:
              summary: "Unusual data access pattern detected"
              description: "Abnormally high access rate to sensitive data endpoints."
              runbook_url: "https://docs.metapharm.ch/runbooks/suspicious-data-access"

  # Database rules
  database.yml: |
    groups:
      - name: database
        interval: 30s
        rules:
          - alert: DatabaseConnectionPoolExhausted
            expr: database_connections_active / database_connections_max > 0.9
            for: 2m
            labels:
              severity: critical
              category: database
            annotations:
              summary: "Database connection pool nearly exhausted"
              description: "Database connection pool is at {{ "{{" }} $value | humanizePercentage {{ "}}" }} capacity."
              runbook_url: "https://docs.metapharm.ch/runbooks/db-connections"

          - alert: SlowDatabaseQueries
            expr: histogram_quantile(0.95, rate(database_query_duration_seconds_bucket[5m])) > 1
            for: 5m
            labels:
              severity: warning
              category: database
            annotations:
              summary: "Slow database queries detected"
              description: "95th percentile database query time is {{ "{{" }} $value {{ "}}" }}s (>1s)."
              runbook_url: "https://docs.metapharm.ch/runbooks/slow-queries"

          - alert: DatabaseReplicationLag
            expr: postgres_replication_lag_seconds > 30
            for: 5m
            labels:
              severity: warning
              category: database
            annotations:
              summary: "Database replication lag detected"
              description: "PostgreSQL replication lag is {{ "{{" }} $value {{ "}}" }} seconds."
              runbook_url: "https://docs.metapharm.ch/runbooks/replication-lag"

  # Infrastructure rules
  infrastructure.yml: |
    groups:
      - name: infrastructure
        interval: 30s
        rules:
          - alert: HighMemoryUsage
            expr: container_memory_usage_bytes{job=~"metapharm-.*"} / container_spec_memory_limit_bytes > 0.9
            for: 5m
            labels:
              severity: warning
              category: infrastructure
            annotations:
              summary: "High memory usage"
              description: "Container {{ "{{" }} $labels.container {{ "}}" }} is using {{ "{{" }} $value | humanizePercentage {{ "}}" }} of its memory limit."
              runbook_url: "https://docs.metapharm.ch/runbooks/high-memory"

          - alert: HighCPUUsage
            expr: rate(container_cpu_usage_seconds_total{job=~"metapharm-.*"}[5m]) > 0.9
            for: 10m
            labels:
              severity: warning
              category: infrastructure
            annotations:
              summary: "High CPU usage"
              description: "Container {{ "{{" }} $labels.container {{ "}}" }} is using {{ "{{" }} $value | humanizePercentage {{ "}}" }} CPU."
              runbook_url: "https://docs.metapharm.ch/runbooks/high-cpu"

          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total{namespace="metapharm"}[15m]) > 0
            for: 5m
            labels:
              severity: critical
              category: infrastructure
            annotations:
              summary: "Pod is crash looping"
              description: "Pod {{ "{{" }} $labels.pod {{ "}}" }} in namespace {{ "{{" }} $labels.namespace {{ "}}" }} is crash looping."
              runbook_url: "https://docs.metapharm.ch/runbooks/crash-loop"

          - alert: PersistentVolumeSpaceLow
            expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.1
            for: 5m
            labels:
              severity: warning
              category: infrastructure
            annotations:
              summary: "Persistent volume space running low"
              description: "PersistentVolume {{ "{{" }} $labels.persistentvolumeclaim {{ "}}" }} has less than 10% space remaining."
              runbook_url: "https://docs.metapharm.ch/runbooks/pv-space-low"

  # Business metrics rules
  business-metrics.yml: |
    groups:
      - name: business-metrics
        interval: 60s
        rules:
          - alert: LowPrescriptionProcessingRate
            expr: rate(prescription_processing_success_total[10m]) < 0.5
            for: 10m
            labels:
              severity: warning
              category: business
            annotations:
              summary: "Low prescription processing rate"
              description: "Prescription processing rate has dropped to {{ "{{" }} $value {{ "}}" }} per second."
              runbook_url: "https://docs.metapharm.ch/runbooks/low-prescription-rate"

          - alert: PaymentServiceDegraded
            expr: rate(payment_transactions_failed_total[5m]) / rate(payment_transactions_total[5m]) > 0.05
            for: 5m
            labels:
              severity: critical
              category: business
            annotations:
              summary: "Payment service degraded"
              description: "Payment failure rate is {{ "{{" }} $value | humanizePercentage {{ "}}" }}."
              runbook_url: "https://docs.metapharm.ch/runbooks/payment-failures"

          - alert: DeliveryTrackingUnavailable
            expr: up{job="metapharm-delivery-service"} == 0
            for: 5m
            labels:
              severity: warning
              category: business
            annotations:
              summary: "Delivery tracking service unavailable"
              description: "Delivery tracking is down. Active deliveries cannot be tracked."
              runbook_url: "https://docs.metapharm.ch/runbooks/delivery-tracking-down"

          - alert: LowActiveUsers
            expr: active_users_total < 10
            for: 30m
            labels:
              severity: info
              category: business
            annotations:
              summary: "Unusually low active user count"
              description: "Only {{ "{{" }} $value {{ "}}" }} active users in the last 30 minutes. Possible issue with user authentication or frontend."
              runbook_url: "https://docs.metapharm.ch/runbooks/low-active-users"
{{- end }}
