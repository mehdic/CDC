{{- if .Values.alertmanagerIngress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.alertmanager.name }}-ingress
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ .Values.alertmanager.name }}
    {{- include "prometheus.labels" . | nindent 4 }}
  {{- with .Values.alertmanagerIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.alertmanagerIngress.className }}
  ingressClassName: {{ .Values.alertmanagerIngress.className }}
  {{- end }}
  {{- if .Values.alertmanagerIngress.tls }}
  tls:
    {{- range .Values.alertmanagerIngress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.alertmanagerIngress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ .Values.alertmanager.name }}
                port:
                  number: {{ .Values.alertmanager.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
