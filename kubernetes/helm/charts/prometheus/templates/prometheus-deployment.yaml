{{- if .Values.prometheus.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.prometheus.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ .Values.prometheus.name }}
    {{- include "prometheus.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.prometheus.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.prometheus.name }}
      {{- include "prometheus.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ .Values.prometheus.name }}
        {{- include "prometheus.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.prometheus.service.port }}"
        prometheus.io/path: "/-/metrics"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.prometheus.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Values.prometheus.name }}
        image: "{{ .Values.prometheus.image.registry }}/{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
        imagePullPolicy: {{ .Values.prometheus.image.pullPolicy }}
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--storage.tsdb.retention.time={{ .Values.prometheus.persistence.retention }}'
          - '--storage.tsdb.retention.size={{ .Values.prometheus.persistence.retentionSize }}'
          - '--web.console.libraries=/usr/share/prometheus/console_libraries'
          - '--web.console.templates=/usr/share/prometheus/consoles'
          - '--web.route-prefix=/'
          - '--web.enable-lifecycle'
        ports:
        - name: http
          containerPort: {{ .Values.prometheus.service.port }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        resources:
          {{- toYaml .Values.prometheus.resources | nindent 12 }}
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-rules
          mountPath: /etc/prometheus/rules
        {{- if .Values.prometheus.persistence.enabled }}
        - name: prometheus-storage
          mountPath: {{ .Values.prometheus.persistence.mountPath }}
        {{- end }}
      volumes:
      - name: prometheus-config
        configMap:
          name: {{ .Values.prometheus.name }}-config
      - name: prometheus-rules
        configMap:
          name: {{ .Values.prometheus.name }}-rules
      {{- if .Values.prometheus.persistence.enabled }}
      - name: prometheus-storage
        persistentVolumeClaim:
          claimName: {{ .Values.prometheus.name }}-pvc
      {{- end }}
{{- end }}
