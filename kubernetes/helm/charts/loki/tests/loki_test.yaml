apiVersion: v1
kind: Pod
metadata:
  name: loki-test
  namespace: logging
spec:
  serviceAccountName: loki
  containers:
  - name: test
    image: alpine:latest
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl

        echo "=== Testing Loki Deployment ==="

        # Test 1: Check if service exists
        echo "Test 1: Service discovery..."
        if nslookup loki.logging.svc.cluster.local > /dev/null 2>&1; then
          echo "✓ Service loki.logging.svc.cluster.local is accessible"
        else
          echo "✗ Service loki.logging.svc.cluster.local is NOT accessible"
          exit 1
        fi

        # Test 2: Check Loki readiness
        echo ""
        echo "Test 2: Loki readiness probe..."
        response=$(curl -s -w "\n%{http_code}" http://loki:3100/ready)
        http_code=$(echo "$response" | tail -n1)
        if [ "$http_code" = "200" ]; then
          echo "✓ Loki is ready (HTTP $http_code)"
        else
          echo "✗ Loki returned HTTP $http_code"
          exit 1
        fi

        # Test 3: Check metrics endpoint
        echo ""
        echo "Test 3: Metrics endpoint..."
        metrics=$(curl -s http://loki:3100/metrics | grep -c "loki_")
        if [ "$metrics" -gt 0 ]; then
          echo "✓ Loki metrics available ($metrics metrics found)"
        else
          echo "✗ Loki metrics not accessible"
          exit 1
        fi

        # Test 4: Test query endpoint
        echo ""
        echo "Test 4: LogQL query endpoint..."
        query_response=$(curl -s -H "Accept: application/json" \
          "http://loki:3100/loki/api/v1/query" \
          --data-urlencode '{namespace="logging"}')

        if echo "$query_response" | grep -q "status"; then
          echo "✓ LogQL query endpoint is working"
        else
          echo "✗ LogQL query endpoint is not working"
          exit 1
        fi

        echo ""
        echo "=== All Loki Tests Passed ==="

  restartPolicy: Never
