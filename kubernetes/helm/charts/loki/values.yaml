# Default values for Loki
# This is a YAML-formatted file.

global:
  environment: development
  namespace: logging
  clusterName: metapharm-cluster

# Loki StatefulSet configuration
loki:
  enabled: true
  name: loki
  replicaCount: 1

  image:
    repository: grafana/loki
    tag: 2.9.3
    pullPolicy: IfNotPresent

  # Service configuration
  service:
    type: ClusterIP
    port: 3100
    targetPort: 3100
    annotations: {}

  # StatefulSet configuration
  statefulSet:
    # Update strategy for zero-downtime updates
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        partition: 0

  # Pod configuration
  podAnnotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '3100'
    prometheus.io/path: '/metrics'

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    capabilities:
      drop:
        - ALL

  # Resource requests and limits
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # Health check configuration
  healthCheck:
    livenessProbe:
      httpGet:
        path: /ready
        port: 3100
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 3

    readinessProbe:
      httpGet:
        path: /ready
        port: 3100
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 3

  # Storage configuration
  persistence:
    enabled: true
    storageClassName: standard
    size: 10Gi
    mountPath: /loki/chunks
    # Data retention: 30 days
    retentionDays: 30

  # Affinity configuration
  affinity:
    podAntiAffinity: prefer
    nodeAffinity: {}

# Configuration for Loki
config:
  # Authentication and tenancy
  auth_enabled: false  # Set to true if multi-tenancy required

  # Ingester configuration
  ingester:
    chunk_idle_period: 3m
    chunk_retain_period: 1m
    max_chunk_age: 1h
    chunk_size_bytes: 1048576  # 1MB
    max_streams_per_user: 10000
    lifecycler:
      ring:
        kvstore:
          store: inmemory

  # Schema configuration
  schema_config:
    configs:
      - from: 2024-01-01
        store: boltdb-shipper
        object_store: filesystem
        schema: v11
        index:
          prefix: loki_index_
          period: 24h

  # Server configuration
  server:
    http_listen_port: 3100
    http_server_read_timeout: 600s
    http_server_write_timeout: 600s
    log_level: info

  # Storage configuration
  storage_config:
    boltdb_shipper:
      active_index_directory: /loki/boltdb-shipper-active
      cache_location: /loki/boltdb-shipper-cache
      shared_store: filesystem
    filesystem:
      directory: /loki/chunks

  # Limits configuration (GDPR/HIPAA compliance)
  limits_config:
    # Maximum number of log streams a user can have
    max_streams_per_user: 10000
    # Maximum bytes per second per user
    max_bytes_per_second: 10485760  # 10MB/s
    # Maximum retention period
    retention_period: 720h  # 30 days

  # Table manager for retention
  table_manager:
    retention_deletes_enabled: true
    retention_period: 720h  # 30 days

# Promtail DaemonSet configuration (included here for reference, main config in promtail chart)
promtail:
  enabled: true
  config:
    clients:
      - url: http://loki:3100/loki/api/v1/push
    positions:
      filename: /tmp/positions.yaml
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: replace
            target_label: container

# RBAC configuration
rbac:
  create: true

# ServiceAccount configuration
serviceAccount:
  create: true
  name: loki
  annotations: {}

# ConfigMap for Loki configuration
configMap:
  create: true
  name: loki-config

# Test configuration
test:
  enabled: true
  image:
    repository: busybox
    tag: latest
