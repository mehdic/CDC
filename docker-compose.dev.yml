  # ========================================
  # Frontend Service Overrides (Dev Mode)
  # ========================================

  web:
    build:
      args:
        NODE_ENV: development
    environment:
      NODE_ENV: development
    volumes:
      - ./web/src:/app/src
      - ./web/package.json:/app/package.json
    command: npm run dev

  dashboard-v2:
    build:
      args:
        NODE_ENV: development
    environment:
      NODE_ENV: development
    volumes:
      - ./dashboard-v2/src:/app/src
      - ./dashboard-v2/package.json:/app/package.json
    command: npm run dev

  bazinga-dashboard:
    build:
      args:
        NODE_ENV: development
    environment:
      NODE_ENV: development
    volumes:
      - ./bazinga/dashboard-v2/src:/app/src
      - ./bazinga/dashboard-v2/package.json:/app/package.json
    command: npm run dev

  # ========================================
  # Infrastructure Overrides (Logging)
  # ========================================

  postgres:
    environment:
      # Enable query logging
      POSTGRES_INITDB_ARGS: "-c log_statement=all -c log_duration=on -c log_min_duration_statement=100"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  redis:
    command: redis-server --appendonly yes --loglevel debug
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  jaeger:
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
