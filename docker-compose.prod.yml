version: '3.9'

#############################################
# MetaPharm Connect - Production Configuration
#############################################
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# Production-specific configuration:
# - Pre-built images (no build context)
# - Resource limits (CPU, memory)
# - Production logging configuration
# - Secrets from environment variables
# - Restart policies with delays
# - Volume persistence with backups
#############################################

services:
  # ========================================
  # Infrastructure Services (Production)
  # ========================================

  postgres:
    image: postgres:16-alpine
    container_name: metapharm-postgres-prod
    restart: on-failure:5
    environment:
      POSTGRES_USER: metapharm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-in-production}
      POSTGRES_DB: metapharm_db
      POSTGRES_INITDB_ARGS: "-c max_connections=500 -c shared_buffers=256MB -c effective_cache_size=1GB -c work_mem=16MB -c maintenance_work_mem=64MB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups/postgres:/backups
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metapharm"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
        labels: "service=postgres"

  redis:
    image: redis:7-alpine
    container_name: metapharm-redis-prod
    restart: on-failure:5
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-change-in-production}
    volumes:
      - redis_data:/data
      - ./backups/redis:/backups
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-in-production}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
        labels: "service=redis"

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: metapharm-jaeger-prod
    restart: on-failure:5
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
      MEMORY_MAX_TRACES: 10000
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=jaeger"

  # ========================================
  # Backend Services (Production - Pre-built Images)
  # ========================================

  api-gateway:
    image: ${REGISTRY:-metapharm}/api-gateway:${IMAGE_TAG:-latest}
    restart: on-failure:3
    environment:
      NODE_ENV: production
      PORT: 4000
      SERVICE_NAME: api-gateway
      DATABASE_URL: postgresql://metapharm:${POSTGRES_PASSWORD:-change-in-production}@postgres:5432/metapharm_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-in-production}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-in-production}
      LOG_LEVEL: info
      OTLP_EXPORTER_URL: http://jaeger:4318/v1/traces
    deploy:
      replicas: 2  # Run 2 instances for high availability
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=api-gateway"

