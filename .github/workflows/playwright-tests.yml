name: Playwright E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'web/**'
      - 'package.json'
      - '.github/workflows/playwright-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'web/**'
      - 'package.json'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to test (chromium/firefox/webkit/all)'
        required: false
        default: 'chromium'
      test_type:
        description: 'Test type (smoke/full)'
        required: false
        default: 'smoke'

jobs:
  # Fast smoke tests - runs on every push (chromium only)
  smoke-tests:
    name: Smoke Tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.test_type == 'smoke')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install all dependencies
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Start dev server and run smoke tests
        working-directory: web
        run: |
          # Start Vite dev server in background with visible output
          npm run dev 2>&1 &
          DEV_PID=$!

          echo "Waiting for dev server to start (PID: $DEV_PID)..."

          # Wait for server to be ready (max 2 minutes)
          for i in $(seq 1 120); do
            if curl -s http://localhost:5173 > /dev/null 2>&1; then
              echo "✅ Dev server is ready!"
              break
            fi
            if [ $i -eq 120 ]; then
              echo "❌ Dev server failed to start after 2 minutes"
              # Show any error output from the server
              kill $DEV_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

          # Run smoke tests
          echo "Running smoke tests..."
          npx playwright test --project=chromium --grep @smoke
          TEST_EXIT=$?

          # Cleanup
          kill $DEV_PID 2>/dev/null || true

          exit $TEST_EXIT
        timeout-minutes: 10
        env:
          CI: true

      - name: Upload test results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-test-results
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # Full E2E tests - runs on PRs and manual trigger
  full-tests:
    name: Full E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.test_type == 'full')

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install all dependencies
        run: npm ci

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Start dev server and run tests
        working-directory: web
        run: |
          # Start Vite dev server in background
          npm run dev 2>&1 &
          DEV_PID=$!

          echo "Waiting for dev server to start (PID: $DEV_PID)..."

          # Wait for server to be ready (max 2 minutes)
          for i in $(seq 1 120); do
            if curl -s http://localhost:5173 > /dev/null 2>&1; then
              echo "✅ Dev server is ready!"
              break
            fi
            if [ $i -eq 120 ]; then
              echo "❌ Dev server failed to start after 2 minutes"
              kill $DEV_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

          # Run tests with 2 workers
          echo "Running Playwright tests (${{ matrix.browser }})..."
          npx playwright test --project=${{ matrix.browser }} --workers=2
          TEST_EXIT=$?

          # Cleanup
          kill $DEV_PID 2>/dev/null || true

          exit $TEST_EXIT
        timeout-minutes: 20
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ matrix.browser }}
          path: |
            web/playwright-report/results.json
            web/playwright-report/junit.xml
          retention-days: 14

  # Report summary job
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [full-tests]
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.full-tests.result }}" == "failure" ]; then
            echo "E2E tests failed!"
            exit 1
          fi
          echo "All E2E tests passed!"

      - name: Comment PR with results
        uses: actions/github-script@v7
        if: failure()
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Playwright E2E Tests Failed**\n\nPlease check the workflow logs for details.'
            })
