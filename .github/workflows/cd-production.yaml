name: Continuous Deployment - Production (Blue-Green)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  pre-deployment-checks:
    name: Pre-Deployment Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate environment
        run: |
          echo "🔍 Pre-deployment validation..."

          if [ -z "${{ secrets.PRODUCTION_KUBECONFIG }}" ]; then
            echo "❌ Missing PRODUCTION_KUBECONFIG secret"
            exit 1
          fi

          if [ -z "${{ secrets.PRODUCTION_REGISTRY_TOKEN }}" ]; then
            echo "❌ Missing PRODUCTION_REGISTRY_TOKEN secret"
            exit 1
          fi

          echo "✅ All required secrets are configured"
          echo "✅ Proceeding with production deployment"

      - name: Check deployment readiness
        run: |
          echo "📋 Deployment Readiness Checklist:"
          echo "✓ Production environment selected: ${{ github.event.inputs.environment }}"
          echo "✓ Branch: ${{ github.ref }}"
          echo "✓ Commit: ${{ github.sha }}"
          echo "✓ Triggered by: ${{ github.actor }}"

  approval-gate:
    name: Manual Approval Required
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://metapharm-connect.com
    needs: pre-deployment-checks

    steps:
      - name: Deployment Approval
        run: |
          echo "🚀 Deployment approval required for production"
          echo "Deployment ID: ${{ github.run_id }}"
          echo "Triggered by: ${{ github.actor }}"

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: approval-gate
    outputs:
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      web-image: ${{ steps.meta-web.outputs.tags }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract backend metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Extract web metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-blue-green:
    name: Deploy Blue-Green
    runs-on: ubuntu-latest
    needs: [approval-gate, build-and-push]
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.28.0

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.PRODUCTION_KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy Blue Environment
        run: |
          echo "🔵 Deploying Blue environment..."

          # Export current production as blue
          kubectl -n production get deployment backend -o yaml > blue-backend.yaml || true
          kubectl -n production get deployment web -o yaml > blue-web.yaml || true

          echo "✅ Blue environment snapshot created"

      - name: Deploy Green Environment
        run: |
          echo "🟢 Deploying Green environment..."

          # Deploy new version as green
          kubectl set image deployment/backend \
            backend=${{ needs.build-and-push.outputs.backend-image }} \
            -n production-green || true

          kubectl set image deployment/web \
            web=${{ needs.build-and-push.outputs.web-image }} \
            -n production-green || true

          # Wait for rollout
          kubectl rollout status deployment/backend -n production-green --timeout=5m
          kubectl rollout status deployment/web -n production-green --timeout=5m

          echo "✅ Green environment deployed and ready"

      - name: Run Health Checks
        run: |
          echo "🏥 Running health checks..."

          # Wait for services to be ready
          sleep 10

          # Check backend service
          BACKEND_HEALTH=$(kubectl get service backend -n production-green -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          if [ -z "$BACKEND_HEALTH" ]; then
            echo "⚠️ Backend service endpoint not ready"
          else
            echo "✅ Backend service endpoint: $BACKEND_HEALTH"
          fi

          # Check web service
          WEB_HEALTH=$(kubectl get service web -n production-green -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          if [ -z "$WEB_HEALTH" ]; then
            echo "⚠️ Web service endpoint not ready"
          else
            echo "✅ Web service endpoint: $WEB_HEALTH"
          fi

  run-smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-blue-green

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: e2e
        run: npm ci

      - name: Run smoke tests against green
        working-directory: e2e
        run: npm run test:smoke
        env:
          API_URL: ${{ secrets.PRODUCTION_GREEN_API_URL }}
          WEB_URL: ${{ secrets.PRODUCTION_GREEN_WEB_URL }}
        continue-on-error: true

  switch-traffic:
    name: Switch Traffic from Blue to Green
    runs-on: ubuntu-latest
    needs: run-smoke-tests

    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.PRODUCTION_KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Switch ingress to green
        run: |
          echo "🔄 Switching traffic from Blue to Green..."

          # Update ingress to point to green services
          kubectl patch ingress metapharm-ingress -n production -p '{"spec":{"rules":[{"host":"metapharm-connect.com","http":{"paths":[{"path":"/api","pathType":"Prefix","backend":{"service":{"name":"backend-green","port":{"number":3000}}}},{"path":"/","pathType":"Prefix","backend":{"service":{"name":"web-green","port":{"number":80}}}}]}}]}}'

          echo "✅ Traffic switched to Green environment"

      - name: Verify traffic routing
        run: |
          echo "📊 Verifying traffic routing..."
          kubectl get ingress metapharm-ingress -n production -o wide
          kubectl get services -n production-green

  post-deployment:
    name: Post-Deployment Tasks
    runs-on: ubuntu-latest
    needs: switch-traffic
    if: always()

    steps:
      - name: Notification - Deployment Success
        if: needs.switch-traffic.result == 'success'
        run: |
          echo "✅ Production deployment completed successfully"
          echo "Deployment timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Commit SHA: ${{ github.sha }}"

      - name: Notification - Deployment Failure
        if: needs.switch-traffic.result == 'failure'
        run: |
          echo "❌ Production deployment failed"
          echo "Please review logs and initiate rollback if necessary"
          exit 1

      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        run: |
          STATUS=${{ needs.switch-traffic.result == 'success' && 'SUCCESS ✅' || 'FAILED ❌' }}

          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"🚀 Production Deployment $STATUS\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"**Production Deployment $STATUS**\n\nCommit: \`${{ github.sha }}\`\nTriggered by: ${{ github.actor }}\nTime: $(date)\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>\"
                  }
                }
              ]
            }"
        continue-on-error: true

  rollback:
    name: Rollback Plan (Manual)
    runs-on: ubuntu-latest
    needs: post-deployment
    if: failure()

    steps:
      - name: Prepare rollback instructions
        run: |
          echo "🔄 Rollback Instructions:"
          echo ""
          echo "1. Run the following command to switch back to Blue:"
          echo "   ./scripts/rollback.sh --environment production --target blue"
          echo ""
          echo "2. Verify the rollback:"
          echo "   kubectl rollout status deployment/backend -n production"
          echo ""
          echo "3. Confirm with:"
          echo "   kubectl get pods -n production"
          echo ""
          echo "Manual rollback may be required. Contact DevOps team."
