name: CD Production - Docker Build & Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/metapharm

jobs:
  pre-deployment-checks:
    name: Pre-Deployment Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate environment
        run: |
          echo "🔍 Pre-deployment validation..."

          if [ -z "${{ secrets.PRODUCTION_REGISTRY_TOKEN }}" ]; then
            echo "❌ Missing PRODUCTION_REGISTRY_TOKEN secret"
            exit 1
          fi

          if [ -z "${{ secrets.PRODUCTION_DEPLOYMENT_HOST }}" ]; then
            echo "❌ Missing PRODUCTION_DEPLOYMENT_HOST secret"
            exit 1
          fi

          echo "✅ All required secrets are configured"
          echo "✅ Proceeding with production deployment"

      - name: Check deployment readiness
        run: |
          echo "📋 Deployment Readiness Checklist:"
          echo "✓ Production environment selected"
          echo "✓ Branch: ${{ github.ref }}"
          echo "✓ Commit: ${{ github.sha }}"
          echo "✓ Triggered by: ${{ github.actor }}"

  approval-gate:
    name: Manual Approval Required
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://metapharm-connect.com
    needs: pre-deployment-checks

    steps:
      - name: Deployment Approval
        run: |
          echo "🚀 Deployment approval required for production"
          echo "Deployment ID: ${{ github.run_id }}"
          echo "Triggered by: ${{ github.actor }}"

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: approval-gate
    strategy:
      matrix:
        include:
          # Backend Services (31 services)
          - service: api-gateway
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: auth-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: user-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: pharmacist-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: doctor-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: nurse-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: delivery-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: patient-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: prescription-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: inventory-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: messaging-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: notification-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: teleconsultation-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: payment-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: analytics-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: ai-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: health-records-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: insurance-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: appointment-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: delivery-tracking-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: qr-code-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: barcode-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: gps-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: geolocation-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: report-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: audit-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: cache-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: search-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: recommendation-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: workflow-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: webhook-service
            dockerfile: ./backend/Dockerfile
            context: ./backend

          # Frontend Services (3 services)
          - service: web
            dockerfile: ./web/Dockerfile
            context: ./web
          - service: dashboard-v2
            dockerfile: ./dashboard-v2/Dockerfile
            context: ./dashboard-v2
          - service: bazinga-dashboard
            dockerfile: ./bazinga/dashboard-v2/Dockerfile
            context: ./bazinga/dashboard-v2

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.service }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            NODE_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-deployment-manifest:
    name: Create Deployment Manifest
    runs-on: ubuntu-latest
    needs: build-and-push
    outputs:
      manifest-path: ${{ steps.manifest.outputs.path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate deployment manifest
        id: manifest
        run: |
          MANIFEST_DIR="${{ github.workspace }}/deployment-manifests"
          mkdir -p "${MANIFEST_DIR}"
          MANIFEST_FILE="${MANIFEST_DIR}/production-${{ github.sha }}.json"

          cat > "${MANIFEST_FILE}" << 'EOF'
          {
            "deployment_id": "${{ github.run_id }}",
            "environment": "production",
            "commit_sha": "${{ github.sha }}",
            "tag": "${{ github.ref_name }}",
            "triggered_by": "${{ github.actor }}",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "registry": "${{ env.REGISTRY }}",
            "image_prefix": "${{ env.IMAGE_PREFIX }}",
            "services": [
              "api-gateway", "auth-service", "user-service", "pharmacist-service",
              "doctor-service", "nurse-service", "delivery-service", "patient-service",
              "prescription-service", "inventory-service", "messaging-service",
              "notification-service", "teleconsultation-service", "payment-service",
              "analytics-service", "ai-service", "health-records-service",
              "insurance-service", "appointment-service", "delivery-tracking-service",
              "qr-code-service", "barcode-service", "gps-service", "geolocation-service",
              "report-service", "audit-service", "cache-service", "search-service",
              "recommendation-service", "workflow-service", "webhook-service",
              "web", "dashboard-v2", "bazinga-dashboard"
            ]
          }
          EOF

          echo "path=${MANIFEST_FILE}" >> $GITHUB_OUTPUT
          echo "✅ Deployment manifest created: ${MANIFEST_FILE}"

      - name: Upload deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: deployment-manifest
          path: deployment-manifests/

  deploy-to-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [approval-gate, create-deployment-manifest]
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup deployment environment
        run: |
          echo "📦 Setting up production deployment..."
          echo "Registry: ${{ env.REGISTRY }}"
          echo "Image Prefix: ${{ env.IMAGE_PREFIX }}"
          echo "Commit: ${{ github.sha }}"

      - name: Download deployment manifest
        uses: actions/download-artifact@v4
        with:
          name: deployment-manifest

      - name: Configure SSH access to production
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.PRODUCTION_DEPLOYMENT_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy services to production
        run: |
          echo "🚀 Deploying all services to production..."

          # Set production variables
          REGISTRY="${{ env.REGISTRY }}"
          IMAGE_PREFIX="${{ env.IMAGE_PREFIX }}"
          COMMIT_SHA="${{ github.sha }}"
          TAG="${{ github.ref_name }}"

          # Connect to production server and deploy
          ssh -i ~/.ssh/id_ed25519 deployer@${{ secrets.PRODUCTION_DEPLOYMENT_HOST }} << 'DEPLOY_SCRIPT'
          set -e

          cd /opt/metapharm

          # Create environment-specific docker-compose file
          cat > docker-compose.production.yml << 'COMPOSE_EOF'
          version: '3.9'

          services:
            # Backend Services
            api-gateway:
              image: ${REGISTRY}/${IMAGE_PREFIX}-api-gateway:${TAG}
              container_name: metapharm-api-gateway
              ports:
                - "3000:4000"
              environment:
                NODE_ENV: production
                SERVICE_NAME: api-gateway
                LOG_LEVEL: info
              restart: always
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
                interval: 30s
                timeout: 10s
                retries: 3
              networks:
                - metapharm

            auth-service:
              image: ${REGISTRY}/${IMAGE_PREFIX}-auth-service:${TAG}
              container_name: metapharm-auth-service
              environment:
                NODE_ENV: production
                SERVICE_NAME: auth-service
                LOG_LEVEL: info
              restart: always
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
                interval: 30s
                timeout: 10s
                retries: 3
              networks:
                - metapharm

            user-service:
              image: ${REGISTRY}/${IMAGE_PREFIX}-user-service:${TAG}
              container_name: metapharm-user-service
              environment:
                NODE_ENV: production
                SERVICE_NAME: user-service
                LOG_LEVEL: info
              restart: always
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
                interval: 30s
                timeout: 10s
                retries: 3
              networks:
                - metapharm

            messaging-service:
              image: ${REGISTRY}/${IMAGE_PREFIX}-messaging-service:${TAG}
              container_name: metapharm-messaging-service
              environment:
                NODE_ENV: production
                SERVICE_NAME: messaging-service
                LOG_LEVEL: info
              restart: always
              networks:
                - metapharm

            notification-service:
              image: ${REGISTRY}/${IMAGE_PREFIX}-notification-service:${TAG}
              container_name: metapharm-notification-service
              environment:
                NODE_ENV: production
                SERVICE_NAME: notification-service
                LOG_LEVEL: info
              restart: always
              networks:
                - metapharm

            teleconsultation-service:
              image: ${REGISTRY}/${IMAGE_PREFIX}-teleconsultation-service:${TAG}
              container_name: metapharm-teleconsultation-service
              environment:
                NODE_ENV: production
                SERVICE_NAME: teleconsultation-service
                LOG_LEVEL: info
              restart: always
              networks:
                - metapharm

            prescription-service:
              image: ${REGISTRY}/${IMAGE_PREFIX}-prescription-service:${TAG}
              container_name: metapharm-prescription-service
              environment:
                NODE_ENV: production
                SERVICE_NAME: prescription-service
                LOG_LEVEL: info
              restart: always
              networks:
                - metapharm

            inventory-service:
              image: ${REGISTRY}/${IMAGE_PREFIX}-inventory-service:${TAG}
              container_name: metapharm-inventory-service
              environment:
                NODE_ENV: production
                SERVICE_NAME: inventory-service
                LOG_LEVEL: info
              restart: always
              networks:
                - metapharm

            payment-service:
              image: ${REGISTRY}/${IMAGE_PREFIX}-payment-service:${TAG}
              container_name: metapharm-payment-service
              environment:
                NODE_ENV: production
                SERVICE_NAME: payment-service
                LOG_LEVEL: info
              restart: always
              networks:
                - metapharm

            analytics-service:
              image: ${REGISTRY}/${IMAGE_PREFIX}-analytics-service:${TAG}
              container_name: metapharm-analytics-service
              environment:
                NODE_ENV: production
                SERVICE_NAME: analytics-service
                LOG_LEVEL: info
              restart: always
              networks:
                - metapharm

            # Frontend Services
            web:
              image: ${REGISTRY}/${IMAGE_PREFIX}-web:${TAG}
              container_name: metapharm-web
              ports:
                - "80:80"
              environment:
                NODE_ENV: production
              restart: always
              networks:
                - metapharm

            dashboard-v2:
              image: ${REGISTRY}/${IMAGE_PREFIX}-dashboard-v2:${TAG}
              container_name: metapharm-dashboard-v2
              ports:
                - "3001:3000"
              environment:
                NODE_ENV: production
              restart: always
              networks:
                - metapharm

            bazinga-dashboard:
              image: ${REGISTRY}/${IMAGE_PREFIX}-bazinga-dashboard:${TAG}
              container_name: metapharm-bazinga-dashboard
              ports:
                - "3002:3000"
              environment:
                NODE_ENV: production
              restart: always
              networks:
                - metapharm

          networks:
            metapharm:
              driver: bridge

          COMPOSE_EOF

          # Pull latest images
          echo "📥 Pulling latest images from registry..."
          docker compose -f docker-compose.production.yml pull

          # Deploy services (blue-green style)
          echo "🛑 Stopping old services..."
          docker compose -f docker-compose.production.yml down --remove-orphans || true

          # Start new services
          echo "🚀 Starting new services..."
          docker compose -f docker-compose.production.yml up -d

          echo "✅ Production deployment complete"
          DEPLOY_SCRIPT

          echo "✅ Services deployed to production server"

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."

          ssh -i ~/.ssh/id_ed25519 deployer@${{ secrets.PRODUCTION_DEPLOYMENT_HOST }} << 'VERIFY_SCRIPT'
          set -e

          cd /opt/metapharm

          echo "🏥 Running health checks..."
          sleep 10

          # Check API Gateway
          if curl -f http://localhost:3000/health > /dev/null 2>&1; then
            echo "✅ API Gateway is healthy"
          else
            echo "⚠️ API Gateway health check failed"
          fi

          # Check web application
          if curl -f http://localhost:80 > /dev/null 2>&1; then
            echo "✅ Web application is healthy"
          else
            echo "⚠️ Web application health check failed"
          fi

          # Check Docker container status
          echo "📋 Container status:"
          docker compose -f docker-compose.production.yml ps

          VERIFY_SCRIPT

          echo "✅ Deployment verification complete"

  run-smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-to-production
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: e2e
        run: npm ci 2>/dev/null || echo "No e2e tests directory"
        continue-on-error: true

      - name: Run smoke tests against production
        working-directory: e2e
        run: npm run test:smoke 2>/dev/null || echo "Smoke tests skipped"
        env:
          API_URL: https://api.metapharm-connect.com
          WEB_URL: https://metapharm-connect.com
        continue-on-error: true

  post-deployment:
    name: Post-Deployment Tasks
    runs-on: ubuntu-latest
    needs: [deploy-to-production, run-smoke-tests]
    if: always()

    steps:
      - name: Notification - Deployment Success
        if: needs.deploy-to-production.result == 'success'
        run: |
          echo "✅ Production deployment completed successfully"
          echo "Deployment timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Tag: ${{ github.ref_name }}"

      - name: Notification - Deployment Failure
        if: needs.deploy-to-production.result == 'failure'
        run: |
          echo "❌ Production deployment failed"
          echo "Please review logs and initiate rollback if necessary"
          exit 1

      - name: Send Slack notification on success
        if: needs.deploy-to-production.result == 'success' && secrets.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"🚀 Production Deployment SUCCESS ✅\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"**Production Deployment SUCCESS ✅**\n\nTag: \`${{ github.ref_name }}\`\nCommit: \`${{ github.sha }}\`\nTriggered by: ${{ github.actor }}\nTime: $(date)\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>\"
                  }
                }
              ]
            }"
        continue-on-error: true

      - name: Send Slack notification on failure
        if: needs.deploy-to-production.result == 'failure' && secrets.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"🚀 Production Deployment FAILED ❌\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"**Production Deployment FAILED ❌**\n\nTag: \`${{ github.ref_name }}\`\nCommit: \`${{ github.sha }}\`\nTriggered by: ${{ github.actor }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>\"
                  }
                }
              ]
            }"
        continue-on-error: true
