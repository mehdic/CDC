name: Environment Promotion

on:
  workflow_dispatch:
    inputs:
      source_environment:
        description: 'Source environment'
        required: true
        type: choice
        options:
          - dev
          - staging
      target_environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - prod
      image_tag:
        description: 'Docker image tag to promote'
        required: true
        type: string

concurrency:
  group: promotion-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  validate-promotion:
    name: Validate Promotion Request
    runs-on: ubuntu-latest

    steps:
      - name: Validate promotion path
        run: |
          SOURCE="${{ inputs.source_environment }}"
          TARGET="${{ inputs.target_environment }}"

          # Ensure proper promotion flow: dev → staging → prod
          if [ "$SOURCE" = "dev" ] && [ "$TARGET" != "staging" ]; then
            echo "❌ ERROR: Cannot promote from dev to $TARGET. Must go dev → staging first."
            exit 1
          fi

          if [ "$SOURCE" = "staging" ] && [ "$TARGET" != "prod" ]; then
            echo "❌ ERROR: Cannot promote from staging to $TARGET."
            exit 1
          fi

          echo "✅ Valid promotion path: $SOURCE → $TARGET"

      - name: Check image exists
        run: |
          echo "Verifying image tag: ${{ inputs.image_tag }}"
          # In production, verify image exists in registry

  pre-promotion-tests:
    name: Pre-Promotion Tests
    runs-on: ubuntu-latest
    needs: validate-promotion

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/web:${{ inputs.image_tag }}
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Verify CI passed
        run: |
          # Check that all CI workflows passed for this image
          echo "Verifying CI status for image tag: ${{ inputs.image_tag }}"
          # In production, query GitHub API to verify CI status

  promote-staging:
    name: Promote to Staging
    runs-on: ubuntu-latest
    needs: pre-promotion-tests
    if: inputs.target_environment == 'staging'
    environment: staging

    steps:
      - name: Deploy to staging
        uses: ./.github/workflows/k8s-deploy.yml
        with:
          environment: staging
          image_tag: ${{ inputs.image_tag }}
        secrets: inherit

      - name: Run staging smoke tests
        run: |
          echo "Running staging smoke tests..."
          # Add staging-specific smoke tests

      - name: Update promotion log
        run: |
          echo "## ✅ Promoted to Staging" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** ${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Source:** ${{ inputs.source_environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Promoted By:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY

  promote-production:
    name: Promote to Production
    runs-on: ubuntu-latest
    needs: pre-promotion-tests
    if: inputs.target_environment == 'prod'
    environment:
      name: production
      url: https://metapharm.ch

    steps:
      - name: Create production deployment plan
        run: |
          echo "## 🚀 Production Deployment Plan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** ${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Source Environment:** ${{ inputs.source_environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Strategy:** Blue-Green with Progressive Rollout" >> $GITHUB_STEP_SUMMARY
          echo "- **Rollback Plan:** Automated on health check failure" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Critical Services:**" >> $GITHUB_STEP_SUMMARY
          echo "- API Gateway" >> $GITHUB_STEP_SUMMARY
          echo "- Auth Service" >> $GITHUB_STEP_SUMMARY
          echo "- Prescription Service" >> $GITHUB_STEP_SUMMARY
          echo "- Teleconsultation Service" >> $GITHUB_STEP_SUMMARY

      - name: Wait for manual approval
        run: |
          echo "⏳ Waiting for production deployment approval..."
          echo "This deployment requires manual approval in GitHub Environments."

      - name: Deploy to production (Canary - 10%)
        uses: ./.github/workflows/k8s-deploy.yml
        with:
          environment: prod
          image_tag: ${{ inputs.image_tag }}
        secrets: inherit

      - name: Monitor canary deployment
        run: |
          echo "Monitoring canary deployment for 10 minutes..."
          sleep 600

          # Check error rates, latency, etc.
          # In production, query monitoring system (Prometheus, Datadog, etc.)

      - name: Progressive rollout to 100%
        run: |
          echo "Canary successful. Rolling out to 100% of traffic..."
          # Update traffic split to 100%

      - name: Production smoke tests
        run: |
          echo "Running production smoke tests..."
          # Critical path smoke tests

      - name: Update production deployment log
        run: |
          echo "## ✅ Deployed to Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** ${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Source:** ${{ inputs.source_environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed By:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Duration:** ${{ job.duration }} seconds" >> $GITHUB_STEP_SUMMARY

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [promote-staging, promote-production]
    if: success()

    steps:
      - name: Send success notification
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "✅ Environment Promotion Successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *Promotion Complete: ${{ inputs.source_environment }} → ${{ inputs.target_environment }}*"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Image Tag:*\n${{ inputs.image_tag }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Promoted By:*\n${{ github.actor }}"
                    }
                  ]
                }
              ]
            }
        if: secrets.SLACK_WEBHOOK_URL != ''
        continue-on-error: true

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [promote-staging, promote-production]
    if: failure()

    steps:
      - name: Send failure notification
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "❌ Environment Promotion Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Promotion Failed: ${{ inputs.source_environment }} → ${{ inputs.target_environment }}*"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Image Tag:*\n${{ inputs.image_tag }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Triggered By:*\n${{ github.actor }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Failed Workflow>"
                  }
                }
              ]
            }
        if: secrets.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
