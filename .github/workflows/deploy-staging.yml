name: Deploy to Staging - Docker Build & Deploy

on:
  push:
    branches:
      - staging
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - qa

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/metapharm

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Backend Services (31 services)
          - service: api-gateway
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: auth-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: user-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: pharmacist-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: doctor-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: nurse-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: delivery-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: patient-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: prescription-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: inventory-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: messaging-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: notification-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: teleconsultation-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: payment-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: analytics-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: ai-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: health-records-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: insurance-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: appointment-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: delivery-tracking-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: qr-code-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: barcode-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: gps-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: geolocation-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: report-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: audit-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: cache-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: search-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: recommendation-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: workflow-service
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - service: webhook-service
            dockerfile: ./backend/Dockerfile
            context: ./backend

          # Frontend Services (3 services)
          - service: web
            dockerfile: ./web/Dockerfile
            context: ./web
          - service: dashboard-v2
            dockerfile: ./dashboard-v2/Dockerfile
            context: ./dashboard-v2
          - service: bazinga-dashboard
            dockerfile: ./bazinga/dashboard-v2/Dockerfile
            context: ./bazinga/dashboard-v2

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.service }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=staging-latest
            type=raw,value=${{ github.event.inputs.environment }}-latest

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            NODE_ENV=staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: https://staging.metapharm-connect.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup deployment environment
        run: |
          echo "📦 Setting up staging deployment..."
          echo "Environment: ${{ github.event.inputs.environment || 'staging' }}"
          echo "Registry: ${{ env.REGISTRY }}"
          echo "Image Prefix: ${{ env.IMAGE_PREFIX }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

      - name: Configure SSH access to staging
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.STAGING_DEPLOYMENT_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy services to staging
        run: |
          echo "🚀 Deploying all services to staging..."

          # Set staging variables
          REGISTRY="${{ env.REGISTRY }}"
          IMAGE_PREFIX="${{ env.IMAGE_PREFIX }}"
          BRANCH="${{ github.ref_name }}"
          ENVIRONMENT="${{ github.event.inputs.environment || 'staging' }}"
          COMMIT_SHA="${{ github.sha }}"

          # Connect to staging server and deploy
          ssh -i ~/.ssh/id_ed25519 deployer@${{ secrets.STAGING_DEPLOYMENT_HOST }} << 'DEPLOY_SCRIPT'
          set -e

          cd /opt/metapharm-staging

          # Create environment-specific docker-compose file
          cat > docker-compose.staging.yml << 'COMPOSE_EOF'
          version: '3.9'

          services:
            # Backend Services
            api-gateway:
              image: ${REGISTRY}/${IMAGE_PREFIX}-api-gateway:${BRANCH}-${COMMIT_SHA}
              container_name: metapharm-staging-api-gateway
              ports:
                - "3000:4000"
              environment:
                NODE_ENV: staging
                SERVICE_NAME: api-gateway
                LOG_LEVEL: debug
              restart: always
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
                interval: 30s
                timeout: 10s
                retries: 3
              networks:
                - metapharm-staging

            auth-service:
              image: ${REGISTRY}/${IMAGE_PREFIX}-auth-service:${BRANCH}-${COMMIT_SHA}
              container_name: metapharm-staging-auth-service
              environment:
                NODE_ENV: staging
                SERVICE_NAME: auth-service
                LOG_LEVEL: debug
              restart: always
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
                interval: 30s
                timeout: 10s
                retries: 3
              networks:
                - metapharm-staging

            user-service:
              image: ${REGISTRY}/${IMAGE_PREFIX}-user-service:${BRANCH}-${COMMIT_SHA}
              container_name: metapharm-staging-user-service
              environment:
                NODE_ENV: staging
                SERVICE_NAME: user-service
                LOG_LEVEL: debug
              restart: always
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
                interval: 30s
                timeout: 10s
                retries: 3
              networks:
                - metapharm-staging

            messaging-service:
              image: ${REGISTRY}/${IMAGE_PREFIX}-messaging-service:${BRANCH}-${COMMIT_SHA}
              container_name: metapharm-staging-messaging-service
              environment:
                NODE_ENV: staging
                SERVICE_NAME: messaging-service
                LOG_LEVEL: debug
              restart: always
              networks:
                - metapharm-staging

            notification-service:
              image: ${REGISTRY}/${IMAGE_PREFIX}-notification-service:${BRANCH}-${COMMIT_SHA}
              container_name: metapharm-staging-notification-service
              environment:
                NODE_ENV: staging
                SERVICE_NAME: notification-service
                LOG_LEVEL: debug
              restart: always
              networks:
                - metapharm-staging

            teleconsultation-service:
              image: ${REGISTRY}/${IMAGE_PREFIX}-teleconsultation-service:${BRANCH}-${COMMIT_SHA}
              container_name: metapharm-staging-teleconsultation-service
              environment:
                NODE_ENV: staging
                SERVICE_NAME: teleconsultation-service
                LOG_LEVEL: debug
              restart: always
              networks:
                - metapharm-staging

            prescription-service:
              image: ${REGISTRY}/${IMAGE_PREFIX}-prescription-service:${BRANCH}-${COMMIT_SHA}
              container_name: metapharm-staging-prescription-service
              environment:
                NODE_ENV: staging
                SERVICE_NAME: prescription-service
                LOG_LEVEL: debug
              restart: always
              networks:
                - metapharm-staging

            inventory-service:
              image: ${REGISTRY}/${IMAGE_PREFIX}-inventory-service:${BRANCH}-${COMMIT_SHA}
              container_name: metapharm-staging-inventory-service
              environment:
                NODE_ENV: staging
                SERVICE_NAME: inventory-service
                LOG_LEVEL: debug
              restart: always
              networks:
                - metapharm-staging

            payment-service:
              image: ${REGISTRY}/${IMAGE_PREFIX}-payment-service:${BRANCH}-${COMMIT_SHA}
              container_name: metapharm-staging-payment-service
              environment:
                NODE_ENV: staging
                SERVICE_NAME: payment-service
                LOG_LEVEL: debug
              restart: always
              networks:
                - metapharm-staging

            analytics-service:
              image: ${REGISTRY}/${IMAGE_PREFIX}-analytics-service:${BRANCH}-${COMMIT_SHA}
              container_name: metapharm-staging-analytics-service
              environment:
                NODE_ENV: staging
                SERVICE_NAME: analytics-service
                LOG_LEVEL: debug
              restart: always
              networks:
                - metapharm-staging

            # Frontend Services
            web:
              image: ${REGISTRY}/${IMAGE_PREFIX}-web:${BRANCH}-${COMMIT_SHA}
              container_name: metapharm-staging-web
              ports:
                - "80:80"
              environment:
                NODE_ENV: staging
              restart: always
              networks:
                - metapharm-staging

            dashboard-v2:
              image: ${REGISTRY}/${IMAGE_PREFIX}-dashboard-v2:${BRANCH}-${COMMIT_SHA}
              container_name: metapharm-staging-dashboard-v2
              ports:
                - "3001:3000"
              environment:
                NODE_ENV: staging
              restart: always
              networks:
                - metapharm-staging

            bazinga-dashboard:
              image: ${REGISTRY}/${IMAGE_PREFIX}-bazinga-dashboard:${BRANCH}-${COMMIT_SHA}
              container_name: metapharm-staging-bazinga-dashboard
              ports:
                - "3002:3000"
              environment:
                NODE_ENV: staging
              restart: always
              networks:
                - metapharm-staging

          networks:
            metapharm-staging:
              driver: bridge

          COMPOSE_EOF

          # Pull latest images
          echo "📥 Pulling latest images from registry..."
          docker compose -f docker-compose.staging.yml pull

          # Stop and remove old containers
          echo "🛑 Stopping old services..."
          docker compose -f docker-compose.staging.yml down --remove-orphans || true

          # Deploy new services
          echo "🚀 Starting new services..."
          docker compose -f docker-compose.staging.yml up -d

          echo "✅ Staging deployment complete"
          DEPLOY_SCRIPT

          echo "✅ Services deployed to staging server"

      - name: Run database migrations
        run: |
          echo "🗄️ Running database migrations..."

          ssh -i ~/.ssh/id_ed25519 deployer@${{ secrets.STAGING_DEPLOYMENT_HOST }} << 'MIGRATE_SCRIPT'
          set -e

          cd /opt/metapharm-staging

          # Run migrations in docker container
          docker compose -f docker-compose.staging.yml run --rm api-gateway npm run migrate:up || echo "⚠️ No migrations to run"

          MIGRATE_SCRIPT

          echo "✅ Database migrations completed"

  verify-deployment:
    name: Verify Staging Deployment
    runs-on: ubuntu-latest
    needs: deploy-to-staging

    steps:
      - name: Configure SSH access to staging
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.STAGING_DEPLOYMENT_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify deployment health
        run: |
          echo "🔍 Verifying staging deployment..."

          ssh -i ~/.ssh/id_ed25519 deployer@${{ secrets.STAGING_DEPLOYMENT_HOST }} << 'VERIFY_SCRIPT'
          set -e

          cd /opt/metapharm-staging

          echo "🏥 Running health checks..."
          sleep 10

          # Check API Gateway
          if curl -f http://localhost:3000/health > /dev/null 2>&1; then
            echo "✅ API Gateway is healthy"
          else
            echo "⚠️ API Gateway health check failed"
          fi

          # Check web application
          if curl -f http://localhost:80 > /dev/null 2>&1; then
            echo "✅ Web application is healthy"
          else
            echo "⚠️ Web application health check failed"
          fi

          # Check Docker container status
          echo "📋 Container status:"
          docker compose -f docker-compose.staging.yml ps

          # Check service logs for errors
          echo "📋 Recent service logs:"
          docker compose -f docker-compose.staging.yml logs --tail=20 api-gateway || true

          VERIFY_SCRIPT

          echo "✅ Deployment verification complete"

  run-smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: verify-deployment
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: e2e
        run: npm ci 2>/dev/null || echo "No e2e tests directory"
        continue-on-error: true

      - name: Run smoke tests against staging
        working-directory: e2e
        run: npm run test:smoke 2>/dev/null || echo "Smoke tests skipped"
        env:
          API_URL: https://staging-api.metapharm-connect.com
          WEB_URL: https://staging.metapharm-connect.com
        continue-on-error: true

      - name: Health Check - API Gateway
        run: |
          echo "🔍 Checking API Gateway health..."
          curl -v https://staging-api.metapharm-connect.com/health || echo "⚠️ API Gateway not responding"
        continue-on-error: true

      - name: Health Check - Auth Service
        run: |
          echo "🔍 Checking Auth Service health..."
          curl -v https://staging-api.metapharm-connect.com/api/auth/health || echo "⚠️ Auth Service not responding"
        continue-on-error: true

      - name: Health Check - Web Application
        run: |
          echo "🔍 Checking Web Application..."
          curl -v https://staging.metapharm-connect.com || echo "⚠️ Web Application not responding"
        continue-on-error: true

  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-to-staging, verify-deployment]
    if: always()

    steps:
      - name: Deployment Success Notification
        if: needs.deploy-to-staging.result == 'success' && needs.verify-deployment.result == 'success'
        run: |
          echo "✅ Staging deployment completed successfully"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "URL: https://staging.metapharm-connect.com"

      - name: Deployment Failure Notification
        if: needs.deploy-to-staging.result == 'failure' || needs.verify-deployment.result == 'failure'
        run: |
          echo "❌ Staging deployment failed"
          echo "Please review logs and retry"
          exit 1

      - name: Send Slack notification on success
        if: needs.deploy-to-staging.result == 'success' && secrets.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"🚀 Staging Deployment SUCCESS ✅\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"**Staging Deployment SUCCESS ✅**\n\nBranch: \`${{ github.ref_name }}\`\nCommit: \`${{ github.sha }}\`\nURL: https://staging.metapharm-connect.com\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>\"
                  }
                }
              ]
            }"
        continue-on-error: true

      - name: Send Slack notification on failure
        if: (needs.deploy-to-staging.result == 'failure' || needs.verify-deployment.result == 'failure') && secrets.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"🚀 Staging Deployment FAILED ❌\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"**Staging Deployment FAILED ❌**\n\nBranch: \`${{ github.ref_name }}\`\nCommit: \`${{ github.sha }}\`\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>\"
                  }
                }
              ]
            }"
        continue-on-error: true
