# Security Vulnerability Scanning Workflow (T2-028)
# Runs on every push, pull request, and nightly schedule
# Blocks deployment on HIGH/CRITICAL vulnerabilities

name: Security Vulnerability Scan

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root workspace dependencies
        run: npm install --prefer-offline --no-audit

      - name: Backend - NPM Audit
        run: |
          echo "🔍 Running npm audit for backend..."
          npm audit --workspace=backend --audit-level=moderate --json > npm-audit-backend.json || true
          npm audit --workspace=backend --audit-level=moderate || true

      - name: Mobile - NPM Audit
        run: |
          echo "🔍 Running npm audit for mobile..."
          npm audit --workspace=mobile --audit-level=moderate --json > npm-audit-mobile.json || true
          npm audit --workspace=mobile --audit-level=moderate || true

      - name: Web - NPM Audit
        run: |
          echo "🔍 Running npm audit for web..."
          npm audit --workspace=web --audit-level=moderate --json > npm-audit-web.json || true
          npm audit --workspace=web --audit-level=moderate || true

      - name: Check for CRITICAL vulnerabilities
        run: |
          echo "🔍 Checking for CRITICAL vulnerabilities..."

          BACKEND_CRIT=$(jq '.metadata.vulnerabilities.critical' npm-audit-backend.json 2>/dev/null || echo "0")
          MOBILE_CRIT=$(jq '.metadata.vulnerabilities.critical' npm-audit-mobile.json 2>/dev/null || echo "0")
          WEB_CRIT=$(jq '.metadata.vulnerabilities.critical' npm-audit-web.json 2>/dev/null || echo "0")

          TOTAL_CRIT=$((BACKEND_CRIT + MOBILE_CRIT + WEB_CRIT))

          echo "Backend CRITICAL: $BACKEND_CRIT"
          echo "Mobile CRITICAL: $MOBILE_CRIT"
          echo "Web CRITICAL: $WEB_CRIT"
          echo "Total CRITICAL: $TOTAL_CRIT"

          if [ "$TOTAL_CRIT" != "0" ] && [ "$TOTAL_CRIT" -gt 0 ]; then
            echo "❌ BLOCKING: Found $TOTAL_CRIT CRITICAL vulnerabilities"
            echo "🔧 Run 'npm audit fix' to resolve automatically fixable issues"
            echo "📋 Review npm-audit-*.json for details"
            exit 1
          else
            echo "✅ No CRITICAL vulnerabilities found"
          fi

          # Report HIGH vulnerabilities as warnings (non-blocking)
          BACKEND_HIGH=$(jq '.metadata.vulnerabilities.high' npm-audit-backend.json 2>/dev/null || echo "0")
          MOBILE_HIGH=$(jq '.metadata.vulnerabilities.high' npm-audit-mobile.json 2>/dev/null || echo "0")
          WEB_HIGH=$(jq '.metadata.vulnerabilities.high' npm-audit-web.json 2>/dev/null || echo "0")

          TOTAL_HIGH=$((BACKEND_HIGH + MOBILE_HIGH + WEB_HIGH))

          if [ "$TOTAL_HIGH" -gt 0 ]; then
            echo "⚠️  WARNING: Found $TOTAL_HIGH HIGH vulnerabilities (non-blocking, likely from dev dependencies)"
            echo "Backend HIGH: $BACKEND_HIGH | Mobile HIGH: $MOBILE_HIGH | Web HIGH: $WEB_HIGH"
          fi

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-reports
          path: |
            npm-audit-backend.json
            npm-audit-mobile.json
            npm-audit-web.json
          retention-days: 30

  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    # Only run Snyk if environment variable is set (secrets cannot be checked in conditions)
    if: ${{ vars.SNYK_ENABLED == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects

      - name: Upload Snyk results to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
        continue-on-error: true

  codeql-analysis:
    name: CodeQL Security Analysis (SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      matrix:
        language: ['javascript', 'typescript']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Dependency Review (PR only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  trivy-scan:
    name: Trivy Container/IaC Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images for scanning
        run: |
          # Build the api-gateway service with proper tagging
          docker compose -f docker-compose.yml build api-gateway
        continue-on-error: true

      - name: Run Trivy vulnerability scanner (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results-fs.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0' # Non-blocking for filesystem scan

      - name: Get built image ID for scanning
        id: image-id
        run: |
          # Try to get the image ID from docker compose; fallback to scanning code only if docker fails
          IMAGE_ID=$(docker image ls --filter "dangling=false" --format "{{.Repository}}:{{.Tag}}" | grep -E "cdc-api-gateway|api-gateway" | head -1 || echo "")
          if [ -z "$IMAGE_ID" ]; then
            echo "image_found=false" >> $GITHUB_OUTPUT
          else
            echo "image_found=true" >> $GITHUB_OUTPUT
            echo "image_id=$IMAGE_ID" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Run Trivy vulnerability scanner on Docker images
        if: steps.image-id.outputs.image_found == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: ${{ steps.image-id.outputs.image_id }}
          format: 'sarif'
          output: 'trivy-results-image.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0' # Non-blocking for first scan
        continue-on-error: true

      - name: Upload Trivy Filesystem results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results-fs.sarif'
          category: 'trivy-fs'
        continue-on-error: true

      - name: Upload Trivy Docker Image results to GitHub Security tab
        if: steps.image-id.outputs.image_found == 'true' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results-image.sarif'
          category: 'trivy-image'
        continue-on-error: true

  secret-scanning:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for secret scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [npm-audit, codeql-analysis, trivy-scan, secret-scanning]
    if: always()
    steps:
      - name: Security Scan Summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| NPM Audit | ${{ needs.npm-audit.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | ${{ needs.codeql-analysis.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy | ${{ needs.trivy-scan.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | ${{ needs.secret-scanning.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.npm-audit.result }}" != "success" ] || [ "${{ needs.codeql-analysis.result }}" != "success" ] || [ "${{ needs.trivy-scan.result }}" != "success" ] || [ "${{ needs.secret-scanning.result }}" != "success" ]; then
            echo "❌ **Security scan failed. Deployment blocked.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **All security scans passed. Safe to deploy.**" >> $GITHUB_STEP_SUMMARY
          fi

  notify-slack:
    name: Notify Slack on Failure
    runs-on: ubuntu-latest
    needs: [npm-audit, codeql-analysis, trivy-scan, secret-scanning]
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "🚨 Security scan failed on main branch",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Security Scan Failed*\n\nBranch: `main`\nWorkflow: Security Vulnerability Scan\nCommit: ${{ github.sha }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
                  }
                }
              ]
            }'
