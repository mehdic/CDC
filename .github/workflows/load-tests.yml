name: Load Testing

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - qa
      duration:
        description: 'Test duration (e.g., 5m, 10m)'
        required: true
        default: '5m'
      vus:
        description: 'Number of virtual users'
        required: true
        default: '50'
  schedule:
    # Run load tests weekly on Sunday at 2 AM UTC
    - cron: '0 2 * * 0'

jobs:
  load-test:
    name: k6 Load Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '1.4.2'

      - name: Run k6 load test - Prescription Processing
        env:
          BASE_URL: ${{ github.event.inputs.environment == 'staging' && 'https://staging.metapharm-connect.com' || 'https://qa.metapharm-connect.com' }}
        run: |
          echo "Running Prescription Processing Load Test against: $BASE_URL"
          k6 run \
            --out json=results-prescription-processing.json \
            --summary-export=summary-prescription-processing.json \
            k6/scripts/prescription-processing.js || true

      - name: Run k6 load test - Delivery Tracking
        env:
          BASE_URL: ${{ github.event.inputs.environment == 'staging' && 'https://staging.metapharm-connect.com' || 'https://qa.metapharm-connect.com' }}
          WS_URL: ${{ github.event.inputs.environment == 'staging' && 'wss://staging.metapharm-connect.com' || 'wss://qa.metapharm-connect.com' }}
        run: |
          echo "Running Delivery Tracking Load Test"
          k6 run \
            --out json=results-delivery-tracking.json \
            --summary-export=summary-delivery-tracking.json \
            k6/scripts/delivery-tracking.js || true

      - name: Run k6 load test - Messaging Throughput
        env:
          BASE_URL: ${{ github.event.inputs.environment == 'staging' && 'https://staging.metapharm-connect.com' || 'https://qa.metapharm-connect.com' }}
        run: |
          echo "Running Messaging Throughput Load Test"
          k6 run \
            --out json=results-messaging.json \
            --summary-export=summary-messaging.json \
            k6/scripts/messaging.js || true

      - name: Run k6 load test - API Gateway
        env:
          BASE_URL: ${{ github.event.inputs.environment == 'staging' && 'https://staging.metapharm-connect.com' || 'https://qa.metapharm-connect.com' }}
        run: |
          echo "Running API Gateway Load Test"
          k6 run \
            --out json=results-api-gateway.json \
            --summary-export=summary-api-gateway.json \
            k6/scripts/api-gateway.js || true

      - name: Run k6 load test - Database Queries
        env:
          BASE_URL: ${{ github.event.inputs.environment == 'staging' && 'https://staging.metapharm-connect.com' || 'https://qa.metapharm-connect.com' }}
        run: |
          echo "Running Database Query Performance Load Test"
          k6 run \
            --out json=results-database-queries.json \
            --summary-export=summary-database-queries.json \
            k6/scripts/database-queries.js || true

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-results
          path: |
            results-*.json
            summary-*.json
          retention-days: 30
        if: always()

      - name: Generate performance report
        run: |
          echo "# Load Testing Report - MetaPharm Connect" > performance-report.md
          echo "" >> performance-report.md
          echo "**Environment**: ${{ github.event.inputs.environment || 'staging' }}" >> performance-report.md
          echo "**Date**: $(date)" >> performance-report.md
          echo "**Workflow**: Load Testing Suite - T7-009" >> performance-report.md
          echo "" >> performance-report.md
          echo "## Test Scenarios Summary" >> performance-report.md
          echo "" >> performance-report.md

          if [ -f summary-prescription-processing.json ]; then
            echo "### 1. Prescription Processing (100 Concurrent Users)" >> performance-report.md
            cat summary-prescription-processing.json >> performance-report.md
            echo "" >> performance-report.md
          fi

          if [ -f summary-delivery-tracking.json ]; then
            echo "### 2. Delivery Tracking - WebSocket (500 Connections)" >> performance-report.md
            cat summary-delivery-tracking.json >> performance-report.md
            echo "" >> performance-report.md
          fi

          if [ -f summary-messaging.json ]; then
            echo "### 3. Messaging Throughput (1000+ msg/min)" >> performance-report.md
            cat summary-messaging.json >> performance-report.md
            echo "" >> performance-report.md
          fi

          if [ -f summary-api-gateway.json ]; then
            echo "### 4. API Gateway (1000 Concurrent Requests)" >> performance-report.md
            cat summary-api-gateway.json >> performance-report.md
            echo "" >> performance-report.md
          fi

          if [ -f summary-database-queries.json ]; then
            echo "### 5. Database Query Performance" >> performance-report.md
            cat summary-database-queries.json >> performance-report.md
            echo "" >> performance-report.md
          fi

          echo "## Reference" >> performance-report.md
          echo "For detailed performance baselines and thresholds, see \`k6/PERFORMANCE_BASELINES.md\`" >> performance-report.md

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: performance-report.md
          retention-days: 30
        if: always()

      - name: Comment results on PR (if triggered from PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('performance-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
