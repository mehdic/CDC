name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      rollback_strategy:
        description: 'Rollback strategy'
        required: true
        type: choice
        options:
          - previous_version
          - specific_version
        default: previous_version
      target_image_tag:
        description: 'Target image tag (only for specific_version strategy)'
        required: false
        type: string

concurrency:
  group: rollback-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate-rollback:
    name: Validate Rollback Request
    runs-on: ubuntu-latest

    steps:
      - name: Validate inputs
        run: |
          if [ "${{ inputs.rollback_strategy }}" = "specific_version" ] && [ -z "${{ inputs.target_image_tag }}" ]; then
            echo "❌ ERROR: target_image_tag is required for specific_version strategy"
            exit 1
          fi

          echo "✅ Rollback validation passed"

      - name: Create rollback plan
        run: |
          echo "## 🔄 Rollback Plan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Strategy:** ${{ inputs.rollback_strategy }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ inputs.target_image_tag }}" ]; then
            echo "- **Target Image Tag:** ${{ inputs.target_image_tag }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Initiated By:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY

  get-previous-version:
    name: Get Previous Version
    runs-on: ubuntu-latest
    needs: validate-rollback
    if: inputs.rollback_strategy == 'previous_version'
    outputs:
      previous_tag: ${{ steps.get-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Get previous deployment tag
        id: get-tag
        run: |
          # Get the current revision
          CURRENT_REVISION=$(kubectl rollout history deployment/api-gateway -n metapharm | tail -n 1 | awk '{print $1}')

          # Get the previous revision
          PREVIOUS_REVISION=$((CURRENT_REVISION - 1))

          # Get the image tag from previous revision
          PREVIOUS_TAG=$(kubectl rollout history deployment/api-gateway -n metapharm --revision=$PREVIOUS_REVISION | grep -oP 'image=.*:\K[^"]+' | head -1)

          echo "Current revision: $CURRENT_REVISION"
          echo "Previous revision: $PREVIOUS_REVISION"
          echo "Previous tag: $PREVIOUS_TAG"

          echo "tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

  backup-current-state:
    name: Backup Current State
    runs-on: ubuntu-latest
    needs: validate-rollback
    environment: ${{ inputs.environment }}

    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Export current state
        run: |
          mkdir -p backup-${{ github.run_id }}

          # Export all deployments
          kubectl get deployments -n metapharm -o yaml > backup-${{ github.run_id }}/deployments.yaml

          # Export all services
          kubectl get services -n metapharm -o yaml > backup-${{ github.run_id }}/services.yaml

          # Export all configmaps
          kubectl get configmaps -n metapharm -o yaml > backup-${{ github.run_id }}/configmaps.yaml

          # Create backup metadata
          cat > backup-${{ github.run_id }}/metadata.json << EOF
          {
            "backup_id": "${{ github.run_id }}",
            "environment": "${{ inputs.environment }}",
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "triggered_by": "${{ github.actor }}",
            "reason": "Pre-rollback backup"
          }
          EOF

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: pre-rollback-backup-${{ github.run_id }}
          path: backup-${{ github.run_id }}
          retention-days: 90

  execute-rollback:
    name: Execute Rollback
    runs-on: ubuntu-latest
    needs: [backup-current-state, get-previous-version]
    if: always() && needs.backup-current-state.result == 'success'
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Determine target version
        id: target
        run: |
          if [ "${{ inputs.rollback_strategy }}" = "previous_version" ]; then
            TARGET_TAG="${{ needs.get-previous-version.outputs.previous_tag }}"
          else
            TARGET_TAG="${{ inputs.target_image_tag }}"
          fi

          echo "Target rollback version: $TARGET_TAG"
          echo "tag=$TARGET_TAG" >> $GITHUB_OUTPUT

      - name: Execute Kubernetes rollback
        run: |
          # Get all deployments in metapharm namespace
          DEPLOYMENTS=$(kubectl get deployments -n metapharm -o name)

          for deployment in $DEPLOYMENTS; do
            echo "Rolling back $deployment..."

            if [ "${{ inputs.rollback_strategy }}" = "previous_version" ]; then
              # Rollback to previous revision
              kubectl rollout undo "$deployment" -n metapharm
            else
              # Set specific image version
              SERVICE_NAME=$(echo "$deployment" | sed 's|deployment.apps/||')
              kubectl set image "$deployment" \
                "$SERVICE_NAME=ghcr.io/${{ github.repository }}/$SERVICE_NAME:${{ steps.target.outputs.tag }}" \
                -n metapharm
            fi
          done

      - name: Wait for rollback to complete
        run: |
          DEPLOYMENTS=$(kubectl get deployments -n metapharm -o name)

          for deployment in $DEPLOYMENTS; do
            echo "Waiting for $deployment rollback to complete..."
            kubectl rollout status "$deployment" -n metapharm --timeout=10m
          done

      - name: Verify rollback health
        run: |
          # Check all pods are running
          UNHEALTHY=$(kubectl get pods -n metapharm --field-selector=status.phase!=Running -o name | wc -l)

          if [ "$UNHEALTHY" -gt 0 ]; then
            echo "❌ ERROR: $UNHEALTHY pods are unhealthy after rollback"
            kubectl get pods -n metapharm --field-selector=status.phase!=Running
            exit 1
          fi

          echo "✅ All pods healthy after rollback"

      - name: Run post-rollback smoke tests
        run: |
          # Get API Gateway endpoint
          API_ENDPOINT=$(kubectl get svc api-gateway-svc -n metapharm -o jsonpath='{.status.loadBalancer.ingress[0].ip}' || echo "localhost")

          # Basic health check
          if [ "$API_ENDPOINT" != "localhost" ]; then
            curl -f http://${API_ENDPOINT}/health || exit 1
          fi

          echo "✅ Post-rollback smoke tests passed"

      - name: Tag rollback
        run: |
          kubectl annotate deployment -n metapharm --all \
            "deployment.kubernetes.io/rollback-timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            "deployment.kubernetes.io/rollback-to-version=${{ steps.target.outputs.tag }}" \
            "deployment.kubernetes.io/rollback-by=${{ github.actor }}" \
            "deployment.kubernetes.io/rollback-run-id=${{ github.run_id }}" \
            --overwrite

  create-incident-report:
    name: Create Incident Report
    runs-on: ubuntu-latest
    needs: execute-rollback
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate incident report
        run: |
          mkdir -p incident-reports

          cat > incident-reports/rollback-${{ github.run_id }}.md << 'EOF'
          # Rollback Incident Report

          ## Summary
          - **Incident ID:** ${{ github.run_id }}
          - **Environment:** ${{ inputs.environment }}
          - **Rollback Strategy:** ${{ inputs.rollback_strategy }}
          - **Initiated By:** ${{ github.actor }}
          - **Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Status:** ${{ needs.execute-rollback.result }}

          ## Rollback Details
          - **Previous Version:** ${{ needs.get-previous-version.outputs.previous_tag }}
          - **Target Version:** ${{ inputs.target_image_tag || 'N/A' }}

          ## Timeline
          1. Rollback initiated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          2. Current state backed up: See artifact `pre-rollback-backup-${{ github.run_id }}`
          3. Rollback executed: ${{ needs.execute-rollback.result }}

          ## Next Steps
          - [ ] Investigate root cause of issue that triggered rollback
          - [ ] Create post-mortem document
          - [ ] Identify preventive measures
          - [ ] Update runbooks if needed

          ## Related Links
          - [Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - [Backup Artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)
          EOF

      - name: Upload incident report
        uses: actions/upload-artifact@v4
        with:
          name: incident-report-${{ github.run_id }}
          path: incident-reports/
          retention-days: 365

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [execute-rollback, create-incident-report]
    if: always()

    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "🔄 Deployment Rollback",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ needs.execute-rollback.result == 'success' && '✅' || '❌' }} *Rollback ${{ needs.execute-rollback.result }}*"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Environment:*\n${{ inputs.environment }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Strategy:*\n${{ inputs.rollback_strategy }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Initiated By:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n${{ needs.execute-rollback.result }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Incident Report>"
                  }
                }
              ]
            }
        if: secrets.SLACK_WEBHOOK_URL != ''
        continue-on-error: true

      - name: Create summary
        run: |
          echo "## 🔄 Rollback Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ needs.execute-rollback.result == 'success' && '✅ Success' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Strategy:** ${{ inputs.rollback_strategy }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Backup Artifact:** pre-rollback-backup-${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Incident Report:** incident-report-${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
